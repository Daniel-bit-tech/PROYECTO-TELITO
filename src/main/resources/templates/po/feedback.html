<html lang="es" data-bs-theme="dark"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TELITO DEVELOPER PORTAL | Sistema de Reservas Deportivas</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="/tabler/dist/libs/jsvectormap/dist/jsvectormap.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-flags.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-socials.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-payments.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-vendors.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-marketing.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-themes.css?1757307620" rel="stylesheet">
    <link href="/tabler/preview/css/demo.css?1757307620" rel="stylesheet">
    <style>
        @import url("https://rsms.me/inter/inter.css");
        .api-card:hover {
            transform: translateY(-5px);
            transition: transform 0.2s ease;
        }
        .quick-action-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .chatbot-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #206bc4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .api-status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .sport-icon {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
        }
    </style>
</head>

<body>
<script src="tabler/dist/js/tabler-theme.min.js?1757307620"></script>
<div class="page">
    <div th:replace="po/header_po.html :: header"></div>
    <div th:replace="~{components/impersonation-banner :: impersonation-banner}"></div>

    <!-- Main Content -->
    <div class="page-wrapper">
        <!-- BEGIN PAGE HEADER -->
        <div class="page-header d-print-none" aria-label="Page header">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">Feedback</h2>
                    </div>
                </div>
            </div>
        </div>
        <!-- END PAGE HEADER -->
        <!-- BEGIN PAGE BODY -->
        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards">

                    <div th:if="${#lists.isEmpty(listaTickets)}" class="col-12 text-center text-secondary py-5">
                        <p>No hay tickets de feedback para mostrar.</p>
                    </div>

                    <div th:each="ticket : ${listaTickets}" class="col-md-6 col-lg-3">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="card-title" th:text="${ticket.asunto}">Asunto del Ticket</h3>
                                <h3 class="card-title mt-4">Usuario</h3>
                                <p class="card-subtitle" th:text="${ticket.usuario.nombre}"></p>
                                <h3 class="card-title mt-4">Descripción</h3>
                                <p class="card-subtitle" th:text="${ticket.descripcion}"></p>
                                <h3 class="card-title mt-4">Estado</h3>
                                <p class="card-subtitle">
                    <span th:text="${ticket.estado ? 'Resuelto' : 'Pendiente'}"
                          th:classappend="${ticket.estado ? 'text-success' : 'text-warning'}"></span>
                                </p>
                            </div>
                            <div class="card-footer">
                                <div class="d-flex">
                                    <form th:if="${!ticket.estado}" th:action="@{/po/tickets/resolver/{id}(id=${ticket.idTicket})}" method="post">
                                        <button type="submit" class="btn btn-link">Resolver</button>
                                    </form>
                                    <span th:if="${ticket.estado}" class="btn btn-link disabled">Cerrado</span>

                                    <a th:href="@{/po/feedbackDetalle/{id}(id=${ticket.idTicket})}" class="btn btn-primary ms-auto">
                                        Ver Detalles
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

        </div>

    </div>


    <div id="footer-placeholder"></div>
</div>

<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js?1757307620"></script>
<script src="/tabler/dist/js/tabler.min.js?1757307620"></script>
<div class="tooltip bs-tooltip-auto fade show" role="tooltip" id="tooltip401309" style="position: absolute; inset: 0px auto auto 0px; margin: 0px; transform: translate3d(983px, 54px, 0px);" data-popper-placement="bottom"><div class="tooltip-arrow" style="position: absolute; transform: translate3d(42.5px, 0px, 0px); left: 0px;"></div><div class="tooltip-inner">Modo claro</div></div></body></html>
