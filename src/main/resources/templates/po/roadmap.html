<body>
<div class="page">
    <div th:replace="po/header_po.html :: header"></div>

    <div class="page-wrapper">
        <div class="container-xl">
            <!-- Main Content -->
            <div class="charts-grid">
                <!-- Gráfico de Roadmap -->
                <div class="chart-container">
                    <div class="chart-header">
                        <h3 class="chart-title">Roadmap de APIs</h3>
                    </div>
                    <div class="chart-canvas">
                        <canvas id="roadmapChart"></canvas>
                    </div>
                </div>

                <!-- Otro gráfico si es necesario -->

                    <div class="chart-header">
                        <h3 class="chart-title">Distribución de Status Codes</h3>
                    </div>

                    </div>
                </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js?1757307620"></script>
<script src="/tabler/dist/js/tabler.min.js?1757307620"></script>

<script>
    // Datos hardcodeados del roadmap
    const roadmapData = [
        { api: 'API Usuarios', start: '2025-05-01T13:30:00Z', end: '2025-10-01T23:00:00Z', estado: 'Nueva' },
        { api: 'API Pagos', start: '2025-06-01T15:00:00Z', end: '2025-09-01T23:00:00Z', estado: 'En desarrollo' },
        { api: 'API Inventario', start: '2025-07-29T14:00:00Z', end: '2025-10-16T22:45:00Z', estado: 'Próxima' },
        { api: 'API Notificaciones', start: '2025-08-19T12:00:00Z', end: '2025-11-16T16:30:00Z', estado: 'Nueva' }
    ];

    // Extraemos los datos del roadmap
    const apiNames = roadmapData.map(item => item.api);
    const startDates = roadmapData.map(item => new Date(item.start).getTime());
    const endDates = roadmapData.map(item => new Date(item.end).getTime());

    // Crear el gráfico usando Chart.js
    const ctx = document.getElementById('roadmapChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: apiNames,
            datasets: [{
                label: 'Fecha de inicio',
                data: startDates,
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            },
                {
                    label: 'Fecha de fin',
                    data: endDates,
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }]
        },
        options: {
            scales: {
                x: {
                    beginAtZero: true
                },
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
