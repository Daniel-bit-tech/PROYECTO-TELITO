<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js?1757307620"></script>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    // Variables globales
    let roadmapChart = null;

    // Variables de paginación
    let currentPage = 1;
    let itemsPerPage = 10;
    let totalItems = 0;

    // Cargar datos desde Thymeleaf - ESTO ES CLAVE
    const roadmapData = /*[[${roadmapData}]]*/ [];
    const roadmapControls = /*[[${roadmapControls}]]*/ [];

    console.log('📊 roadmapData:', roadmapData);
    console.log('🎮 roadmapControls:', roadmapControls);

    // Función para obtener el siguiente estado
    function getNextStatus(currentStatus) {
        switch(currentStatus) {
            case 'Próxima': return 'En desarrollo';
            case 'En desarrollo': return 'Nueva';
            case 'Nueva': return 'Sin estado';
            case 'Sin estado': return 'Próxima';
            default: return 'Próxima';
        }
    }

    // Función para obtener clases CSS
    function getStatusClass(status, type) {
        const statusMap = {
            'Próxima': type === 'badge' ? 'badge-proxima' : 'status-proxima',
            'En desarrollo': type === 'badge' ? 'badge-desarrollo' : 'status-desarrollo',
            'Nueva': type === 'badge' ? 'badge-nueva' : 'status-nueva',
            'Sin estado': type === 'badge' ? 'badge-sin-estado' : 'status-sin-estado'
        };
        return statusMap[status] || statusMap['Sin estado'];
    }

    // Función principal de inicialización
    function initializeRoadmap() {
        console.log('🚀 Inicializando roadmap...');

        // 1. Inicializar event listeners de paginación
        initializePaginationListeners();

        // 2. Renderizar controles de API
        renderApiControls();

        // 3. Inicializar gráfica
        initializeRoadmapChart();

        // 4. Ocultar spinner de carga
        document.querySelector('#api-controls-list .loading-spinner')?.remove();
    }

    // Inicializar event listeners de paginación
    function initializePaginationListeners() {
        const itemsPerPageSelect = document.getElementById('items-per-page');
        if (itemsPerPageSelect) {
            itemsPerPageSelect.addEventListener('change', function() {
                changeItemsPerPage(parseInt(this.value));
            });
        }
    }

    // Renderizar controles de API con paginación
    function renderApiControls() {
        const controlsList = document.getElementById('api-controls-list');

        if (!roadmapControls || roadmapControls.length === 0) {
            controlsList.innerHTML = '<div class="text-center text-muted">No hay APIs disponibles</div>';
            updatePaginationInfo(0, 0, 0);
            updatePaginationControls(0);
            return;
        }

        totalItems = roadmapControls.length;
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
        const paginatedControls = roadmapControls.slice(startIndex, endIndex);

        let html = '';
        paginatedControls.forEach(control => {
            html += `
                <div class="api-control-item" data-id="${control.apiId}">
                    <div class="flex-fill">
                        <div class="d-flex align-items-center">
                            <div class="me-3" style="min-width: 200px;">
                                <strong>${control.apiNombre}</strong>
                            </div>
                            <div class="me-3">
                                <span class="badge ${getStatusClass(control.currentEstado, 'badge')}">
                                    ${control.currentEstado}
                                </span>
                            </div>
                            <div class="status-line ${getStatusClass(control.currentEstado, 'line')}" style="width: 100px;"></div>
                        </div>
                    </div>
                   <div class="ms-3 api-buttons">
    <button class="btn btn-sm btn-primary change-status-btn"
            data-api-id="${control.apiId}"
            onclick="cambiarEstadoApiConConfirm('${control.apiId}')">
        Cambiar Estado
    </button>
    ${control.currentEstado !== 'Sin estado' ?
                `<button class="btn btn-sm btn-secondary reset-status-btn"
                data-api-id="${control.apiId}"
                onclick="restablecerApiConConfirm('${control.apiId}')">
            Restablecer
        </button>` : ''
            }
</div>
                </div>
            `;
        });

        controlsList.innerHTML = html;
        attachEventListeners();

        // Actualizar información de paginación
        updatePaginationInfo(startIndex + 1, endIndex, totalItems);
        updatePaginationControls(Math.ceil(totalItems / itemsPerPage));
    }

    // Actualizar información de paginación
    function updatePaginationInfo(start, end, total) {
        const paginationInfo = document.getElementById('pagination-info');
        if (total === 0) {
            paginationInfo.textContent = 'No hay elementos';
        } else {
            paginationInfo.textContent = `Mostrando ${start} a ${end} de ${total} elementos`;
        }
    }

    // Actualizar controles de paginación
    function updatePaginationControls(totalPages) {
        const paginationControls = document.getElementById('pagination-controls');

        if (totalPages <= 1) {
            paginationControls.innerHTML = '';
            return;
        }

        let html = '';

        // Botón anterior
        html += `
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;" aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
        `;

        // Páginas numéricas
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            html += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                </li>
            `;
        }

        // Botón siguiente
        html += `
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;" aria-label="Siguiente">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        `;

        paginationControls.innerHTML = html;
    }

    // Cambiar página
    function changePage(newPage) {
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        if (newPage >= 1 && newPage <= totalPages && newPage !== currentPage) {
            currentPage = newPage;
            renderApiControls();
        }
    }

    // Cambiar elementos por página
    function changeItemsPerPage(newItemsPerPage) {
        itemsPerPage = newItemsPerPage;
        currentPage = 1; // Resetear a la primera página
        renderApiControls();
    }

    // Adjuntar event listeners
    function attachEventListeners() {
        // Botones de cambiar estado
        document.querySelectorAll('.change-status-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const apiId = this.getAttribute('data-api-id');
                cambiarEstadoApi(apiId);
            });
        });

        // Botones de restablecer
        document.querySelectorAll('.reset-status-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const apiId = this.getAttribute('data-api-id');
                restablecerApi(apiId);
            });
        });
    }

    // REEMPLAZA LAS FUNCIONES cambiarEstadoApi y restablecerApi CON ESTAS VERSIONES MEJORADAS

    // REEMPLAZA LAS FUNCIONES cambiarEstadoApi y restablecerApi CON ESTAS VERSIONES


    // NUEVAS FUNCIONES CON CONFIRMACIÓN
    function cambiarEstadoApiConConfirm(apiId) {
        if (confirm('¿Está seguro de cambiar el estado de esta API?')) {
            cambiarEstadoApi(apiId);
        }
    }

    function restablecerApiConConfirm(apiId) {
        if (confirm('¿Está seguro de restablecer el estado de esta API?')) {
            restablecerApi(apiId);
        }
    }


    function cambiarEstadoApi(apiId) {
        // Primero mostrar confirmación
        if (!confirm('¿Está seguro de cambiar el estado de esta API?')) {
            return; // Si el usuario cancela, no hacer nada
        }

        console.log('🔍 INICIANDO cambiarEstadoApi...');
        console.log('📝 API ID:', apiId);
        console.log('📍 URL completa:', `${window.location.origin}/po/roadmap/${apiId}/estado`);

        const control = roadmapControls.find(c => c.apiId == apiId);
        if (!control) {
            console.error('❌ Control no encontrado para API ID:', apiId);
            alert('Error: No se encontró la API');
            return;
        }

        const nextStatus = getNextStatus(control.currentEstado);
        console.log('🔄 Cambiando estado:', `${control.currentEstado} → ${nextStatus}`);

        // Mostrar loading en el botón
        const button = document.querySelector(`[data-api-id="${apiId}"].change-status-btn`);
        const originalText = button.innerHTML;
        button.innerHTML = '<span class="loading-spinner"></span> Procesando...';
        button.disabled = true;

        fetch(`/po/roadmap/${apiId}/estado`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ nuevoEstado: nextStatus })
        })
            .then(response => {
                console.log('📨 Respuesta HTTP recibida');
                console.log('Status:', response.status);
                console.log('OK:', response.ok);
                console.log('Headers:', Object.fromEntries(response.headers.entries()));

                if (!response.ok) {
                    return response.text().then(text => {
                        console.error('❌ Error en respuesta:', text);
                        throw new Error(`Error ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('✅ ÉXITO - Datos recibidos:', data);
                alert(`✅ Estado cambiado exitosamente a: ${nextStatus}`);
                // Recargar después de un breve delay
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            })
            .catch(error => {
                console.error('❌ ERROR COMPLETO:', error);
                console.error('❌ Mensaje:', error.message);
                console.error('❌ Stack:', error.stack);

                button.innerHTML = originalText;
                button.disabled = false;

                alert(`❌ Error al cambiar estado:\n${error.message}`);
            });
    }

    function restablecerApi(apiId) {
        // Primero mostrar confirmación
        if (!confirm('¿Está seguro de restablecer el estado de esta API?')) {
            return; // Si el usuario cancela, no hacer nada
        }

        console.log('🔍 INICIANDO restablecerApi...');
        console.log('📝 API ID:', apiId);
        console.log('📍 URL completa:', `${window.location.origin}/po/roadmap/${apiId}/restablecer`);

        // Mostrar loading en el botón
        const button = document.querySelector(`[data-api-id="${apiId}"].reset-status-btn`);
        const originalText = button.innerHTML;
        button.innerHTML = '<span class="loading-spinner"></span> Procesando...';
        button.disabled = true;

        fetch(`/po/roadmap/${apiId}/restablecer`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
            .then(response => {
                console.log('📨 Respuesta HTTP recibida');
                console.log('Status:', response.status);
                console.log('OK:', response.ok);

                if (!response.ok) {
                    return response.text().then(text => {
                        console.error('❌ Error en respuesta:', text);
                        throw new Error(`Error ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('✅ ÉXITO - Datos recibidos:', data);
                alert('✅ API restablecida exitosamente');
                // Recargar después de un breve delay
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            })
            .catch(error => {
                console.error('❌ ERROR COMPLETO:', error);
                console.error('❌ Mensaje:', error.message);

                button.innerHTML = originalText;
                button.disabled = false;

                alert(`❌ Error al restablecer API:\n${error.message}`);
            });
    }

    // Inicializar gráfica de roadmap
    function initializeRoadmapChart() {
        const chartElement = document.querySelector("#roadmap-chart");
        if (!chartElement || !roadmapData || roadmapData.length === 0) {
            chartElement.innerHTML = '<div class="text-center text-muted p-4">No hay datos para mostrar en el roadmap. Cambia algunos estados de API para verlos aquí.</div>';
            return;
        }

        // Colores por estado
        const colorPorEstado = {
            'Próxima': '#94d82d',
            'En desarrollo': '#22b8cf',
            'Nueva': '#f59f00'
        };

        // Preparar datos para ApexCharts
        const seriesData = roadmapData.map(item => ({
            x: item.api,
            y: [
                new Date(item.start).getTime(),
                new Date(item.end).getTime()
            ],
            fillColor: colorPorEstado[item.estado] || '#adb5bd'
        }));

        const options = {
            series: [{
                name: 'Roadmap',
                data: seriesData
            }],
            chart: {
                height: 400,
                type: 'rangeBar',
                toolbar: { show: true }
            },
            plotOptions: {
                bar: {
                    horizontal: true,
                    barHeight: '60%',
                    borderRadius: 4
                }
            },
            xaxis: {
                type: 'datetime'
            },
            tooltip: {
                custom: function({ series, seriesIndex, dataPointIndex, w }) {
                    const data = w.config.series[seriesIndex].data[dataPointIndex];
                    const start = new Date(data.y[0]).toLocaleDateString();
                    const end = new Date(data.y[1]).toLocaleDateString();
                    return `
                        <div class="apexcharts-tooltip-title">${data.x}</div>
                        <div class="apexcharts-tooltip-series-group">
                            <div class="apexcharts-tooltip-text">
                                <div class="apexcharts-tooltip-y-group">
                                    <span class="apexcharts-tooltip-text-label">Estado: </span>
                                    <span class="apexcharts-tooltip-text-value">${roadmapData[dataPointIndex].estado}</span>
                                </div>
                                <div class="apexcharts-tooltip-text-label">Período: ${start} - ${end}</div>
                            </div>
                        </div>
                    `;
                }
            },
            colors: ['#94d82d', '#22b8cf', '#f59f00']
        };

        roadmapChart = new ApexCharts(chartElement, options);
        roadmapChart.render();
    }

    // === SISTEMA DE TEMA COPIADO DEL HEADER PO ===
    document.querySelectorAll('.theme-switcher').forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            const theme = this.classList.contains('hide-theme-dark') ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            console.log('🎨 Tema cambiado a:', theme);
        });
    });

    // Aplicar tema guardado
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-bs-theme', savedTheme);
    console.log('🎨 Tema inicial aplicado:', savedTheme);
