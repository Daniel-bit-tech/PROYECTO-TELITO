    <style>
        @import url("https://rsms.me/inter/inter.css");
        .api-card:hover {
            transform: translateY(-5px);
            transition: transform 0.2s ease;
        }
        .quick-action-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .chatbot-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #206bc4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .api-status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .sport-icon {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
        }
        /* Custom styles for the roadmap chart */
        #roadmap-chart {
            width: 100%;
            height: 450px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
<script src="tabler/dist/js/tabler-theme.min.js?1757307620"></script>
<div th:replace="~{components/impersonation-banner :: impersonation-banner}"></div>
<div class="page">
    <div th:replace="~{po/header_po.html :: header}"></div>

    <!-- Main Content -->
    <div class="page-wrapper">
        <!-- BEGIN PAGE HEADER -->
        <div class="page-header d-print-none" aria-label="Page header">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">Roadmap de APIs</h2>
                    </div>
                </div>
            </div>
        </div>
        <!-- END PAGE HEADER -->

        <!-- BEGIN PAGE BODY -->
        <div class="page-body">
            <div class="container-xl">
                <div class="row row-deck row-cards">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="card-title">Roadmap de APIs</h3>
                                <!-- Roadmap Chart Placeholder -->
                                <div id="roadmap-chart"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- END PAGE BODY -->

        <!-- BEGIN FOOTER -->
        <footer class="footer footer-transparent d-print-none">
            <div class="container-xl">
                <div class="row text-center align-items-center flex-row-reverse">
                    <div class="col-lg-auto ms-lg-auto">
                        <ul class="list-inline list-inline-dots mb-0">
                            <li class="list-inline-item"><a href="https://docs.tabler.io" target="_blank" class="link-secondary" rel="noopener">Documentation</a></li>
                            <li class="list-inline-item"><a href="./license.html" class="link-secondary">License</a></li>
                            <li class="list-inline-item">
                                <a href="https://github.com/tabler/tabler" target="_blank" class="link-secondary" rel="noopener">Source code</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
        <!-- END FOOTER -->
    </div>
</div>

<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js?1757307620"></script>
<script src="/tabler/dist/js/tabler.min.js?1757307620"></script>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script th:inline="javascript">
    /*<![CDATA[*/ let roadmapData = [[${roadmapData}]]; console.log(roadmapData); /*]]>*/

    // Colores por estado
    const colorPorEstado = {
        'Nueva': '#f59f00',
        'En desarrollo': '#22b8cf',
        'Próxima': '#94d82d'
    };

    // Preparar datos para ApexCharts
    const seriesData = roadmapData.map(item => ({
        x: item.api,
        y: [new Date(item.start).getTime(), new Date(item.end).getTime()],
        fillColor: colorPorEstado[item.estado] || '#adb5bd',
        estado: item.estado
    }));

    const options = {
        chart: { type: 'rangeBar', height: 460 },
        plotOptions: {
            bar: { horizontal: true, barHeight: '60%', distributed: true }
        },
        series: [{ name: 'Fase', data: seriesData }],
        xaxis: { type: 'datetime', labels: { datetimeUTC: false } },
        tooltip: {
            y: {
                formatter: (val, opts) => {
                    const item = opts.w.config.series[0].data[opts.dataPointIndex];
                    const start = new Date(item.y[0]).toLocaleDateString();
                    const end = new Date(item.y[1]).toLocaleDateString();
                    return '${item.estado} · ${start} → ${end}';
                }
            }
        },
        legend: { show: false },
        dataLabels: {
            enabled: true,
            formatter: (_, opts) => {
                const item = opts.w.config.series[0].data[opts.dataPointIndex];
                return item.estado;
            }
        },
        grid: { strokeDashArray: 3 }
    };

    new ApexCharts(document.querySelector("#roadmap-chart"), options).render();
</script>
</body>
</html>
