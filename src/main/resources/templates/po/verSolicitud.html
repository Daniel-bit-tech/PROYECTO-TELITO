<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>TELITO | Detalle Solicitud</title>
    <link href="/tabler/dist/css/tabler.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-flags.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-vendors.css?1757307620" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url("https://rsms.me/inter/inter.css");
        :root { --tblr-font-sans-serif: 'Inter Var', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif; }

        .chat-bubble {
            border-radius: 8px;
            padding: 1.5rem;
            border-left: 4px solid #206bc4;
        }
        [data-bs-theme="dark"] .chat-bubble {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
        }
    </style>
</head>

<body>
<!-- Banner de impersonación -->
<div th:replace="~{components/simple-impersonation-banner :: simple-impersonation-banner}"></div>
<div class="page">
    <div th:replace="~{po/header_po.html :: header}"></div>

    <div class="page-wrapper">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">Gestión de Accesos</div>
                        <h2 class="page-title">Detalle de la Solicitud</h2>
                    </div>
                    <div class="col-auto ms-auto">
                        <a href="/po/solicitudes" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i> Volver a la bandeja
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <div th:if="${solicitud == null}" class="card">
                    <div class="card-body">
                        <div class="alert alert-danger m-0">
                            <h4>Error de carga</h4>
                            <p>No se pudo cargar la información de la solicitud.</p>
                            <a class="btn btn-primary mt-2" href="/po/solicitudes">Volver</a>
                        </div>
                    </div>
                </div>

                <div th:if="${solicitud != null}" class="card">

                    <div class="card-body">

                        <div class="d-flex align-items-center mb-4 pb-3 border-bottom border-secondary-subtle">
                            <span class="avatar avatar-xl rounded bg-blue-lt me-3"
                                  th:text="${#strings.substring(solicitud.desarrollador, 0, 2)}">JD</span>
                            <div>
                                <h2 class="m-0 text-reset" th:text="${solicitud.desarrollador}">Nombre Desarrollador</h2>
                                <div class="text-secondary small mt-1">
                                    <i class="fas fa-envelope me-1"></i>
                                    <span th:text="${solicitud.email}">email@test.com</span>
                                </div>
                            </div>
                            <div class="ms-auto text-end">
                                <div class="text-uppercase text-secondary small font-weight-bold">Estado</div>
                                <span class="badge mt-1 fs-5"
                                      th:classappend="${solicitud.estado == 'PENDIENTE' ? 'bg-warning' : (solicitud.estado == 'APROBADO' ? 'bg-success' : 'bg-danger')}"
                                      th:text="${solicitud.estado}">PENDIENTE</span>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label class="form-label text-secondary text-uppercase small">API Solicitada</label>
                                <div class="fs-3 font-weight-bold text-blue">
                                    <i class="fas fa-cube me-2"></i>
                                    <span th:text="${solicitud.nombreApi}">Nombre API</span>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label text-secondary text-uppercase small">Equipo del Solicitante</label>
                                <div class="fs-3">
                                    <span th:if="${solicitud.nombreEquipo != null && solicitud.nombreEquipo != ''}"
                                          th:text="${solicitud.nombreEquipo}" class="text-reset">Nombre Equipo</span>

                                    <span th:unless="${solicitud.nombreEquipo != null && solicitud.nombreEquipo != ''}"
                                          class="text-secondary fst-italic">
                                          <i class="fas fa-users-slash me-2"></i> Sin equipo asignado
                                    </span>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label text-secondary text-uppercase small">Fecha Solicitud</label>
                                <div class="fs-3 text-reset" th:text="${solicitud.fechaFormatted}">12/12/2025</div>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label text-secondary text-uppercase small">Motivo / Descripción del uso</label>
                            <div class="chat-bubble">
                                <p class="mb-0" style="font-size: 1rem; line-height: 1.6;"
                                   th:text="${solicitud.descripcionUso}">
                                    Descripción del motivo...
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer d-flex justify-content-end gap-2 border-top border-secondary-subtle">
                        <form th:action="@{/po/solicitudes/rechazar}" method="post">
                            <input type="hidden" name="idSolicitud" th:value="${solicitud.idSolicitudAcceso}"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-outline-danger" onclick="return confirm('¿Rechazar solicitud?')">
                                <i class="fas fa-times me-2"></i> Rechazar
                            </button>
                        </form>

                        <form th:action="@{/po/solicitudes/aprobar}" method="post">
                            <input type="hidden" name="idSolicitud" th:value="${solicitud.idSolicitudAcceso}"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-primary" onclick="return confirm('¿Aprobar solicitud?')">
                                <i class="fas fa-check me-2"></i> Aprobar Solicitud
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
        <div th:replace="~{desarrollador/footer :: footer}"></div>
    </div>
</div>
<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js?1757307620"></script>
<script src="/tabler/dist/js/tabler.min.js?1757307620"></script>
</body>
</html>
