<html lang="es" data-bs-theme="dark"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TELITO DEVELOPER PORTAL | Sistema de Reservas Deportivas</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="/tabler/dist/libs/jsvectormap/dist/jsvectormap.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-flags.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-socials.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-payments.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-vendors.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-marketing.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-themes.css?1757307620" rel="stylesheet">
    <link href="/tabler/preview/css/demo.css?1757307620" rel="stylesheet">
    <style>
        @import url("https://rsms.me/inter/inter.css");
        .api-card:hover {
            transform: translateY(-5px);
            transition: transform 0.2s ease;
        }
        .quick-action-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .chatbot-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #206bc4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .api-status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .sport-icon {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
        }
    </style>
</head>

<body>
<script src="/tabler/dist/js/tabler-theme.min.js"></script>
<div class="page">
    <div th:replace="po/header_po.html :: header"></div>
    <div th:replace="~{components/impersonation-banner :: impersonation-banner}"></div>

    <div class="page-wrapper">
        <div class="page-header d-print-none" aria-label="Page header">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${api.nombre}"></h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div class="card">
                    <div class="card-body">
                        <div class="datagrid">
                            <div class="datagrid-item">
                                <div class="datagrid-title">Nombre</div>
                                <div class="datagrid-content" th:text="${api.nombre}"></div>
                            </div>

                            <div class="datagrid-item">
                                <div class="datagrid-title">Estado</div>
                                <div class="datagrid-content">
                                    <span th:if="${!#lists.isEmpty(api.estadosApi)}" class="status status-green" th:text="${api.estadosApi[0].nombreEstado}">Producción</span>
                                    <span th:if="${#lists.isEmpty(api.estadosApi)}" class="status status-red">Sin estado definido</span>
                                </div>
                            </div>

                            <div class="datagrid-item">
                                <div class="datagrid-title">Descripción</div>
                                <div class="datagrid-content" th:text="${api.descripcion}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>
</div>

<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/tabler/dist/js/tabler.min.js"></script>
</body>
</html>
