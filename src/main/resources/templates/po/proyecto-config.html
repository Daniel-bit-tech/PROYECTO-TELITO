<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TELITO PO PORTAL | Configurar Proyecto</title>

    <link th:href="@{/tabler/dist/css/tabler.css}" rel="stylesheet"/>
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>
<script th:src="@{/tabler/dist/js/tabler-theme.min.js}"></script>

<div class="page">
    <div th:replace="~{components/simple-impersonation-banner :: simple-impersonation-banner}"></div>
    <div th:replace="~{po/header_po :: header}"></div>

    <div class="page-wrapper">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <h2 class="page-title">
                    Configuración - <span th:text="${proyecto.nombre}">Proyecto</span>
                </h2>
                <div class="text-secondary mt-1">
                    PO encargado: <span th:text="${poEncargado != null ? poEncargado.nombre + ' ' + poEncargado.apellidoPaterno + ' ' + poEncargado.apellidoMaterno : 'N/D'}"></span>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Editar datos del proyecto</h3>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/po/proyectos/{id}/config(id=${proyecto.idProyecto})}" method="post">

                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input class="form-control" type="text" name="nombre"
                                       th:value="${proyecto.nombre}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" name="descripcion" rows="4"
                                          th:text="${proyecto.descripcion}"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Visibilidad</label>
                                    <select class="form-select" name="publico">
                                        <option th:value="true"  th:selected="${proyecto.publico}">Público</option>
                                        <option th:value="false" th:selected="${!proyecto.publico}">Privado</option>
                                    </select>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Estado</label>
                                    <select class="form-select" name="activo">
                                        <option th:value="true"  th:selected="${proyecto.activo}">Activo</option>
                                        <option th:value="false" th:selected="${!proyecto.activo}">Inactivo / Finalizado</option>
                                    </select>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fecha fin</label>
                                    <input class="form-control" type="date" name="fechaFin"
                                           th:value="${proyecto.fechaFin != null ? #temporals.format(proyecto.fechaFin, 'yyyy-MM-dd') : ''}">
                                    <div class="form-hint">Si el proyecto está Activo, se limpiará la fecha fin (según regla del controller).</div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">Guardar cambios</button>
                                <a class="btn btn-outline-secondary"
                                   th:href="@{/po/proyectos/{id}(id=${proyecto.idProyecto})}">
                                    Volver al detalle
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>

        <div th:replace="~{po/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/tabler/dist/js/tabler.min.js}"></script>
</body>
</html>
