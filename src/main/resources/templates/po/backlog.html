<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TELITO DEVELOPER PORTAL | Sistema de Reservas Deportivas</title>
    <!-- CSRF tokens for impersonation -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="/tabler/dist/libs/jsvectormap/dist/jsvectormap.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-flags.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-socials.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-payments.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-vendors.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-marketing.css?1757307620" rel="stylesheet">
    <link href="/tabler/dist/css/tabler-themes.css?1757307620" rel="stylesheet">
    <link href="/tabler/preview/css/demo.css?1757307620" rel="stylesheet">
    <style>
        @import url("https://rsms.me/inter/inter.css");
        .api-card:hover {
            transform: translateY(-5px);
            transition: transform 0.2s ease;
        }
        .quick-action-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .chatbot-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #206bc4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .api-status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .sport-icon {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
        }
        .badge-prioridad-alta { background-color: #d63939; }
        .badge-prioridad-media { background-color: #f76707; }
        .badge-prioridad-baja { background-color: #2fb344; }
    </style>
</head>

<body>
<!-- Banner de impersonación -->
<div th:replace="~{components/impersonation-banner :: impersonation-banner}"></div>

<script src="/tabler/dist/js/tabler-theme.min.js?1757307620"></script>
<div class="page">
    <div th:replace="po/header_po.html :: header"></div>

    <!-- Main Content -->
    <div class="page-wrapper">
        <!-- BEGIN PAGE HEADER -->
        <div class="page-header d-print-none" aria-label="Page header">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">BackLog</h2>
                    </div>
                </div>
            </div>
        </div>
        <!-- END PAGE HEADER -->

        <!-- BEGIN PAGE BODY -->
        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards">
                    <div class="col-12">
                        <div class="card">

                            <!-- ✅ ACTUALIZADO: Buscador y selector de tamaño -->
                            <div class="card-body border-bottom py-3">
                                <form th:action="@{/po/backlog}" method="get" class="d-flex">
                                    <div class="text-secondary">
                                        Show
                                        <div class="mx-2 d-inline-block">
                                            <select name="size" class="form-control form-control-sm" onchange="this.form.submit()">
                                                <option value="5" th:selected="${backlogPage.size == 5}">5</option>
                                                <option value="10" th:selected="${backlogPage.size == 10}">10</option>
                                                <option value="20" th:selected="${backlogPage.size == 20}">20</option>
                                                <option value="50" th:selected="${backlogPage.size == 50}">50</option>
                                            </select>
                                        </div>
                                        entries
                                    </div>
                                    <div class="ms-auto text-secondary">
                                        Search:
                                        <div class="ms-2 d-inline-block">
                                            <input type="text" name="search" class="form-control form-control-sm"
                                                   th:value="${search}" placeholder="Buscar..." aria-label="Search invoice">
                                        </div>
                                        <button type="submit" class="btn btn-sm btn-primary ms-2">Buscar</button>
                                        <a th:href="@{/po/backlog}" class="btn btn-sm btn-outline-secondary ms-1">Limpiar</a>
                                    </div>
                                    <input type="hidden" name="page" value="0">
                                </form>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-selectable card-table table-vcenter text-nowrap datatable">
                                    <thead>
                                    <tr>
                                        <th class="w-1">No.</th>
                                        <th>Nombre</th>
                                        <th>Encargados</th>
                                        <th>Prioridad</th>
                                        <th>Estado</th>
                                        <th>Descripción</th>
                                        <th></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <!-- ✅ ACTUALIZADO: Iterar sobre backlogPage.content -->
                                    <tr th:each="backlog, iterStat : ${backlogPage.content}">
                                        <td>
                                                <span class="text-secondary"
                                                      th:text="${(backlogPage.number * backlogPage.size) + iterStat.index + 1}">
                                                </span>
                                        </td>
                                        <td>
                                            <a href="#" class="text-reset" tabindex="-1"
                                               th:text="${backlog.api?.nombre} ?: 'Sin API'">
                                            </a>
                                        </td>
                                        <td th:text="${backlog.usuarioEncargado?.nombre} ?: 'Sin encargado'"></td>
                                        <td>
                                                <span class="badge"
                                                      th:class="${backlog.prioridad == 'Alta'} ? 'badge-prioridad-alta' :
                                                                ${backlog.prioridad == 'Media'} ? 'badge-prioridad-media' :
                                                                'badge-prioridad-baja'"
                                                      th:text="${backlog.prioridad} ?: 'No definida'">
                                                </span>
                                        </td>
                                        <td>
                                                <span class="badge"
                                                      th:class="${backlog.estadoBacklog == 'Resuelto'} ? 'bg-success' :
                                                                ${backlog.estadoBacklog == 'En progreso'} ? 'bg-warning' : 'bg-secondary'"
                                                      th:text="${backlog.estadoBacklog} ?: 'Pendiente'">
                                                </span>
                                        </td>
                                        <td>
                                                <span th:if="${backlog.descripcion != null && backlog.descripcion.length() > 50}"
                                                      th:attr="data-bs-toggle=tooltip"
                                                      th:data-bs-title="${backlog.descripcion}"
                                                      th:text="${#strings.substring(backlog.descripcion, 0, 50) + '...'}">
                                                </span>
                                            <span th:if="${backlog.descripcion != null && backlog.descripcion.length() <= 50}"
                                                  th:text="${backlog.descripcion}">
                                                </span>
                                            <span th:if="${backlog.descripcion == null}" class="text-muted">
                                                    Sin descripción
                                                </span>
                                        </td>
                                        <td class="text-end">
                                            <form th:action="@{/po/backlog/marcar-como-resuelto/{id}(id=${backlog.idBacklog})}" method="post"
                                                  th:if="${backlog.estadoBacklog != 'Resuelto'}">
                                                <input type="hidden" name="search" th:value="${search}">
                                                <input type="hidden" name="page" th:value="${backlogPage.number}">
                                                <input type="hidden" name="size" th:value="${backlogPage.size}">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm btn-primary">Marcar como resuelto</button>
                                            </form>
                                            <span th:if="${backlog.estadoBacklog == 'Resuelto'}" class="text-muted">✔ Resuelto</span>
                                        </td>
                                    </tr>

                                    <!-- ✅ NUEVO: Mensaje cuando no hay resultados -->
                                    <tr th:if="${backlogPage.content.empty}">
                                        <td colspan="7" class="text-center text-muted py-4">
                                            No se encontraron registros en el backlog
                                            <div th:if="${search != null && !search.empty}" class="mt-2">
                                                <small>Intenta con otros términos de búsqueda</small>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- ✅ ACTUALIZADO: Paginación dinámica -->
                            <div class="card-footer" th:if="${backlogPage.totalPages > 0}">
                                <div class="row g-2 justify-content-center justify-content-sm-between">
                                    <div class="col-auto d-flex align-items-center">
                                        <p class="m-0 text-secondary">
                                            Showing
                                            <strong>
                                                <span th:text="${backlogPage.number * backlogPage.size + 1}">1</span>
                                                to
                                                <span th:text="${(backlogPage.number * backlogPage.size) + backlogPage.numberOfElements}">8</span>
                                            </strong>
                                            of
                                            <strong th:text="${backlogPage.totalElements}">16</strong>
                                            entries
                                        </p>
                                    </div>
                                    <div class="col-auto">
                                        <ul class="pagination m-0 ms-auto">
                                            <!-- Botón Anterior -->
                                            <li class="page-item" th:classappend="${backlogPage.first} ? 'disabled' : ''">
                                                <a class="page-link"
                                                   th:href="@{/po/backlog(search=${search}, page=${backlogPage.number - 1}, size=${backlogPage.size})}"
                                                   tabindex="-1" aria-disabled="true">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">
                                                        <path d="M15 6l-6 6l6 6"></path>
                                                    </svg>
                                                </a>
                                            </li>

                                            <!-- Números de página -->
                                            <li th:each="pageNumber : ${#numbers.sequence(0, backlogPage.totalPages - 1)}"
                                                class="page-item" th:classappend="${pageNumber == backlogPage.number} ? 'active' : ''">
                                                <a class="page-link"
                                                   th:href="@{/po/backlog(search=${search}, page=${pageNumber}, size=${backlogPage.size})}"
                                                   th:text="${pageNumber + 1}">1</a>
                                            </li>

                                            <!-- Botón Siguiente -->
                                            <li class="page-item" th:classappend="${backlogPage.last} ? 'disabled' : ''">
                                                <a class="page-link"
                                                   th:href="@{/po/backlog(search=${search}, page=${backlogPage.number + 1}, size=${backlogPage.size})}">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">
                                                        <path d="M9 6l6 6l-6 6"></path>
                                                    </svg>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- END PAGE BODY -->
    </div>

    <!-- Resto de tu código (chatbot, etc.) -->
    <div class="chatbot-container">
        <div class="chatbot-btn" data-bs-toggle="offcanvas" data-bs-target="#offcanvasChatbot">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-message-chatbot" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z"></path>
                <path d="M9.5 9h.01"></path>
                <path d="M14.5 9h.01"></path>
                <path d="M9.5 13a3.5 3.5 0 0 0 5 0"></path>
            </svg>
        </div>
    </div>

    <div th:replace="po/footer.html :: footer"></div>
</div>

<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js?1757307620"></script>
<script src="/tabler/dist/js/tabler.min.js?1757307620"></script>

<script>
    // Inicializar tooltips de Bootstrap
    document.addEventListener('DOMContentLoaded', function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
</script>
</body>
</html>
