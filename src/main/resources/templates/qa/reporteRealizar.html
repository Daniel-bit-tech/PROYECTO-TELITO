<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <!-- CSRF tokens para impersonación -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>TELITO DEVELOPER PORTAL | Crear Reporte</title>
  <!-- Estilos de Tabler y FontAwesome -->
  <link href="/tabler/dist/css/tabler.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url("https://rsms.me/inter/inter.css");
  </style>
</head>
<body>
<script src="/tabler/dist/js/tabler-theme.min.js"></script>
<div class="page">
  <div th:replace="qa/header_qa.html :: header"></div>
  <div th:replace="~{components/impersonation-banner :: impersonation-banner}"></div>
  <div class="page-wrapper">
    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="col" >
            <h2>Crear reporte</h2>
          </div>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div class="container-xl">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Genera un reporte después de validar una API</h3>
          </div>
          <div class="card-body">
            <form method="POST" th:action="@{/qa/guardarReporte}" enctype="multipart/form-data">

              <!-- Combobox de APIs -->
              <div class="mb-3">
                <label class="form-label" for="apiSelect">API a reportar</label>
                <select class="form-select" name="apiId" id="apiSelect" required>
                  <option value="" selected disabled>-- Seleccione una API --</option>
                  <option th:each="apiDto : ${apisParaValidar}"
                          th:value="${apiDto.idApi}"
                          th:text="${apiDto.nombreApi} + ' (Equipo: ' + ${apiDto.nombreProyecto} + ')'">
                  </option>
                </select>
              </div>

              <!-- Selector de Estado -->
              <div class="mb-3">
                <label class="form-label">Estado del reporte</label>
                <select class="form-select" name="estado" required>
                  <option value="">Selecciona el estado del reporte</option>
                  <option th:each="estado : ${estadosReporte}"
                          th:value="${estado}"
                          th:text="${estado}">
                  </option>
                </select>
                <!-- NUEVO: Contenedor para mostrar el error de estado -->
                <div th:if="${errorEstado}" class="text-danger mt-1" th:text="${errorEstado}"></div>
              </div>

              <!-- Campo de Descripción -->
              <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" placeholder="Ingresa una descripcion" rows="6" class="form-control" required maxlength="200"></textarea>
                <div th:if="${errorDescripcion}" class="text-danger mt-1" th:text="${errorDescripcion}"></div>
              </div>

              <!-- Campo para adjuntar archivos -->
              <div class="mb-3">
                <label for="archivo" class="form-label">Adjuntar archivo (opcional):</label>
                <input type="file" id="archivo" name="archivos" class="form-control" accept=".png, .jpg, .jpeg, .log, .txt" multiple />
                <small>Máximo 5 archivos</small>
                <!-- NUEVO: Contenedor para mostrar el error de archivos -->
                <div th:if="${errorArchivos}" class="text-danger mt-1" th:text="${errorArchivos}"></div>
                <div id="error-message" style="color: red; display: none;">Solo se permiten archivos de tipo .png, .jpg, .jpeg, .log o .txt</div>
              </div>

              <div class="mt-4">
                <button type="submit" onclick="return validateFiles()" class="btn btn-primary w-100">
                  Generar reporte
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="qa/footer.html :: footer"></div>
  </div>
</div>
<script src="/tabler/dist/js/tabler.min.js" defer></script>
<script>
  function validateFiles() {
    const fileInput = document.getElementById("archivo");
    const files = fileInput.files;
    const allowedExtensions = ["png", "jpeg", "jpg", "log", "txt"];
    document.getElementById("error-message").style.display = "none";

    for (let i = 0; i < files.length; i++) {
      const fileName = files[i].name;
      const fileExtension = fileName.split('.').pop().toLowerCase();
      if (!allowedExtensions.includes(fileExtension)) {
        document.getElementById("error-message").style.display = "block";
        return false;
      }
    }
    return true;
  }
</script>
</body>
</html>
