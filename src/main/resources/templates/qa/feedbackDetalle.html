<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Detalles de Feedback - TELITO DEVELOPER PORTAL</title>
    <link href="/tabler/dist/libs/star-rating.js/dist/star-rating.min.css" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler.css" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-flags.css" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-socials.css" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-payments.css" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-vendors.css" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-marketing.css" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-themes.css" rel="stylesheet" />
    <link href="/tabler/preview/css/demo.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url("https://rsms.me/inter/inter.css");
    </style>
</head>
<body>
<script src="/tabler/dist/js/tabler-theme.min.js"></script>
<div class="page">
    <div th:replace="qa/header_qa.html :: header"></div>
    <div class="page-wrapper">
        <div class="page-header d-print-none" aria-label="Page header">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">Feedback de la API <span th:text="${feedback.api.nombre}"></span></h2>
                    </div>
                    <div class="col-md-auto">
                        <a th:href="@{/qa/feedback}" class="btn btn-primary">Volver</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-body">
            <div class="container-xl">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Información</h3>
                    </div>
                    <div class="card-body">
                        <div class="datagrid">
                            <div class="datagrid-item">
                                <div class="datagrid-title">Usuario</div>
                                <div class="datagrid-content" th:text="${feedback.usuario.nombre}">Jhon Ortega</div>
                            </div>
                            <div class="datagrid-item">
                                <div class="datagrid-title">API</div>
                                <div class="datagrid-content" th:text="${feedback.api.nombre}"></div>
                            </div>
                            <div class="datagrid-item">
                                <div class="datagrid-title">Calificación</div>
                                <div class="datagrid-content">
                                    <span th:each="i : ${#numbers.sequence(1, feedback.calificacion)}" class="text-warning"><i class="fas fa-star"></i></span>
                                    <span th:each="i : ${#numbers.sequence(feedback.calificacion + 1, 5)}" class="text-muted"><i class="far fa-star"></i></span>
                                </div>
                            </div>
                            <div class="datagrid-item">
                                <div class="datagrid-title">Fecha</div>
                                <div class="datagrid-content" th:text="${#dates.format(feedback.fechaCreacion, 'dd/MM/yyyy HH:mm')}">12/09/2026</div>
                            </div>
                        </div>
                        <br>
                        <div class="datagrid-item">
                            <div class="datagrid-title">Comentario</div>
                            <div class="datagrid-content" th:text="${feedback.comentario}">Lorem ipsum dolor sit amet, consectetur adipisicing elit.</div>
                        </div>
                    </div>
                </div>
                <br>
            </div>
        </div>
        <footer class="footer footer-transparent d-print-none">
            <div class="container-xl">
                <div class="row text-center align-items-center flex-row-reverse">
                    <div class="col-12 col-lg-auto mt-3 mt-lg-0">
                        <ul class="list-inline list-inline-dots mb-0">
                            <li class="list-inline-item">
                                Copyright &copy; 2025
                                <a href="." class="link-secondary">Tabler</a>. All rights reserved.
                            </li>
                            <li class="list-inline-item">
                                <a href="./changelog.html" class="link-secondary" rel="noopener"> v1.4.0 </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</div>
<script src="/tabler/dist/js/tabler.min.js"></script>
<script src="/tabler/preview/js/demo.min.js"></script>
</body>
</html>
