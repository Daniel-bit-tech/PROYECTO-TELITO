<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="footer">
<footer class="footer footer-transparent d-print-none">
    <div class="container-xl">
        <div class="row text-center align-items-center flex-row-reverse">
            <div class="col-lg-auto ms-lg-auto">
                <ul class="list-inline list-inline-dots mb-0">
                    <li class="list-inline-item"><a href="#" class="link-secondary">Soporte</a></li>
                    <li class="list-inline-item"><a href="#" class="link-secondary">Documentación</a></li>
                </ul>
            </div>
            <div class="col-12 col-lg-auto mt-3 mt-lg-0">
                <ul class="list-inline list-inline-dots mb-0">
                    <li class="list-inline-item">
                        Copyright © 2025
                        <a href="" class="link-secondary">TELITO Sports Reservations</a>. Todos los derechos reservados.
                    </li>
                </ul>
            </div>
        </div>
    </div>
</footer>

<!-- Chatbot global -->
<style>
    /* Botón flotante del chatbot */
    .chat-fab {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--tblr-primary) 0%, #0054a6 100%);
        color: white;
        border: none;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        transition: all 0.3s ease;
        z-index: 1000;
    }

    .chat-fab:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 25px rgba(0,0,0,0.4);
    }

    .chat-fab.active {
        background: #dc3545;
    }

    .chat-fab .fa-times {
        display: none;
    }

    .chat-fab.active .fa-robot {
        display: none;
    }

    .chat-fab.active .fa-times {
        display: block;
    }

    /* Notificación tooltip del chatbot */
    .chat-notification {
        position: fixed;
        bottom: 35px;
        right: 100px;
        background: white;
        padding: 15px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        max-width: 280px;
        z-index: 999;
        animation: slideInRight 0.5s ease-out;
        display: none;
    }

    .chat-notification.show {
        display: block;
    }

    .chat-notification::after {
        content: '';
        position: absolute;
        right: -10px;
        top: 50%;
        transform: translateY(-50%);
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 10px 0 10px 10px;
        border-color: transparent transparent transparent white;
    }

    .chat-notification-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        color: var(--tblr-primary);
        font-weight: 600;
    }

    .chat-notification-body {
        color: #666;
        font-size: 14px;
        line-height: 1.4;
    }

    .chat-notification-close {
        position: absolute;
        top: 8px;
        right: 8px;
        background: none;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 18px;
        padding: 0;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.2s;
    }

    .chat-notification-close:hover {
        background: #f0f0f0;
        color: #333;
    }

    @keyframes slideInRight {
        from {
            opacity: 0;
            transform: translateX(50px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* Contenedor del chat flotante */
    .chat-container-global {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 380px;
        height: 550px;
        background-color: var(--tblr-bg-surface);
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        overflow: hidden;
        display: none;
        flex-direction: column;
        z-index: 999;
        animation: slideUp 0.3s ease-out;
    }

    .chat-container-global.show {
        display: flex;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chat-header-global {
        padding: 1.25rem 1.5rem;
        background: linear-gradient(135deg, var(--tblr-primary) 0%, #0054a6 100%);
        color: white;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 500;
    }

    .chat-header-global i {
        font-size: 20px;
    }

    .chat-messages-global {
        flex: 1;
        padding: 1.25rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.875rem;
        background-color: #f8f9fa;
    }

    .chat-messages-global::-webkit-scrollbar {
        width: 6px;
    }

    .chat-messages-global::-webkit-scrollbar-thumb {
        background-color: rgba(0,0,0,0.2);
        border-radius: 3px;
    }

    .message-global {
        max-width: 85%;
        padding: 0.875rem 1rem;
        border-radius: 12px;
        line-height: 1.5;
        font-size: 0.9rem;
        word-wrap: break-word;
    }

    .message-bot-global {
        background-color: white;
        color: #1f2937;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .message-user-global {
        background: linear-gradient(135deg, var(--tblr-primary) 0%, #0054a6 100%);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .chat-input-global {
        padding: 1rem;
        border-top: 1px solid var(--tblr-border-color);
        display: flex;
        gap: 0.75rem;
        background-color: white;
    }

    .chat-input-global input {
        flex: 1;
        padding: 0.75rem 1rem;
        border: 1px solid var(--tblr-border-color);
        border-radius: 20px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
    }

    .chat-input-global input:focus {
        border-color: var(--tblr-primary);
    }

    .chat-input-global button {
        padding: 0.75rem 1rem;
        background: linear-gradient(135deg, var(--tblr-primary) 0%, #0054a6 100%);
        color: white;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }

    .chat-input-global button:hover {
        transform: scale(1.05);
    }

    @media (max-width: 1024px) {
        .chat-container-global {
            width: 90%;
            max-width: 380px;
            right: 15px;
            bottom: 100px;
        }
        
        .chat-fab {
            right: 15px;
        }
        
        .chat-fab:hover {
            transform: scale(1.1);
        }
    }

    @media (max-width: 480px) {
        .chat-container-global {
            width: calc(100% - 30px);
            left: 15px;
            right: 15px;
            bottom: 90px;
        }
        
        .chat-fab {
            right: 15px;
        }
    }
</style>

<!-- Notificación del chatbot -->
<div class="chat-notification" id="chat-notification">
    <button class="chat-notification-close" id="chat-notification-close">
        <i class="fas fa-times"></i>
    </button>
    <div class="chat-notification-header">
        <i class="fas fa-robot"></i>
        <span>¡Hola!</span>
    </div>
    <div class="chat-notification-body">
        Soy tu asistente virtual. Puedo ayudarte a resolver dudas sobre nuestras APIs y crear tickets de soporte. ¡Pregúntame!
    </div>
</div>

<!-- Botón flotante del chatbot -->
<button class="chat-fab" id="chat-fab-global">
    <i class="fas fa-robot"></i>
    <i class="fas fa-times"></i>
</button>

<!-- Ventana del chat (flotante) -->
<div class="chat-container-global" id="chat-container-global">
    <div class="chat-header-global">
        <i class="fas fa-robot"></i>
        <span>Asistente Virtual de Telito</span>
    </div>
    <div class="chat-messages-global" id="chat-messages-global">
        <!-- Los mensajes se cargarán dinámicamente desde sessionStorage -->
    </div>
    <div class="chat-input-global">
        <input type="text" id="chat-input-global" placeholder="Escribe tu mensaje...">
        <button id="send-message-global"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // Control del botón flotante del chatbot con persistencia y creación de tickets
    (function() {
        const chatFabGlobal = document.getElementById('chat-fab-global');
        const chatContainerGlobal = document.getElementById('chat-container-global');
        const chatInputGlobal = document.getElementById('chat-input-global');
        const sendMessageBtnGlobal = document.getElementById('send-message-global');
        const chatMessagesGlobal = document.getElementById('chat-messages-global');
        const CHAT_STORAGE_KEY = 'telito_chatbot_history';

        if (!chatFabGlobal || !chatContainerGlobal) return;

        // Estado del flujo de creación de tickets
        let ticketFlow = {
            active: false,
            step: 0,
            data: {},
            apis: []
        };

        // Cargar historial de conversación al inicio
        loadChatHistory();

        // Mostrar notificación automáticamente después de 2 segundos
        const chatNotification = document.getElementById('chat-notification');
        const chatNotificationClose = document.getElementById('chat-notification-close');
        const NOTIFICATION_SHOWN_KEY = 'telito_chatbot_notification_shown';
        
        // Mostrar notificación solo si no se ha mostrado antes en esta sesión
        if (!sessionStorage.getItem(NOTIFICATION_SHOWN_KEY)) {
            setTimeout(() => {
                chatNotification.classList.add('show');
                // Ocultar automáticamente después de 5 segundos
                setTimeout(() => {
                    chatNotification.classList.remove('show');
                    sessionStorage.setItem(NOTIFICATION_SHOWN_KEY, 'true');
                }, 5000);
            }, 2000);
        }

        // Cerrar notificación manualmente
        chatNotificationClose.addEventListener('click', function(e) {
            e.stopPropagation();
            chatNotification.classList.remove('show');
            sessionStorage.setItem(NOTIFICATION_SHOWN_KEY, 'true');
        });

        // Cerrar notificación y abrir chat al hacer clic en la notificación
        chatNotification.addEventListener('click', function(e) {
            if (e.target !== chatNotificationClose && !chatNotificationClose.contains(e.target)) {
                chatNotification.classList.remove('show');
                sessionStorage.setItem(NOTIFICATION_SHOWN_KEY, 'true');
                chatContainerGlobal.classList.add('show');
                chatFabGlobal.classList.add('active');
                if (chatMessagesGlobal.children.length === 0) {
                    initializeWelcomeMessages();
                }
            }
        });

        chatFabGlobal.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpening = !chatContainerGlobal.classList.contains('show');
            chatContainerGlobal.classList.toggle('show');
            chatFabGlobal.classList.toggle('active');
            
            // Si se está abriendo el chat y no hay mensajes, mostrar bienvenida
            if (isOpening && chatMessagesGlobal.children.length === 0) {
                initializeWelcomeMessages();
            }
        });

        // Cerrar el chat al hacer clic fuera de él
        document.addEventListener('click', function(event) {
            const isClickInsideChat = chatContainerGlobal.contains(event.target);
            const isClickOnFab = chatFabGlobal.contains(event.target);
            
            if (!isClickInsideChat && !isClickOnFab && chatContainerGlobal.classList.contains('show')) {
                chatContainerGlobal.classList.remove('show');
                chatFabGlobal.classList.remove('active');
            }
        });

        sendMessageBtnGlobal.addEventListener('click', sendMessageGlobal);
        chatInputGlobal.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessageGlobal();
            }
        });

        // Obtener CSRF token para las peticiones POST
        const csrfTokenGlobal = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeaderGlobal = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        // Función para cargar el historial desde sessionStorage
        function loadChatHistory() {
            const history = sessionStorage.getItem(CHAT_STORAGE_KEY);
            console.log('🔍 Cargando historial del chat...', history ? 'Encontrado' : 'No encontrado');
            
            if (history) {
                try {
                    const messages = JSON.parse(history);
                    console.log('📝 Mensajes en historial:', messages.length);
                    chatMessagesGlobal.innerHTML = '';
                    messages.forEach(msg => {
                        addMessageToDOM(msg.text, msg.sender, false);
                    });
                    console.log('✅ Historial cargado exitosamente');
                } catch (e) {
                    console.error('❌ Error al cargar historial del chat:', e);
                    initializeWelcomeMessages();
                }
            } else {
                console.log('ℹ️ No hay historial previo, mostrando mensajes de bienvenida');
                initializeWelcomeMessages();
            }
        }

        // Función para inicializar mensajes de bienvenida
        function initializeWelcomeMessages() {
            chatMessagesGlobal.innerHTML = '';
            addMessageToDOM('¡Hola! Soy el asistente virtual de Telito. ¿En qué puedo ayudarte?<br><br><strong>Puedo ayudarte a:</strong><br>• Responder preguntas sobre nuestras APIs<br>• Crear un ticket de soporte<br>• Guiarte en la documentación<br><br>Escribe "crear ticket" para iniciar un nuevo ticket de soporte.', 'bot');
        }

        // Función para guardar el historial en sessionStorage
        function saveChatHistory() {
            const messages = [];
            chatMessagesGlobal.querySelectorAll('.message-global').forEach(msg => {
                const isBot = msg.classList.contains('message-bot-global');
                messages.push({
                    text: msg.innerHTML,
                    sender: isBot ? 'bot' : 'user'
                });
            });
            sessionStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(messages));
            console.log('💾 Historial guardado:', messages.length, 'mensajes');
        }

        async function sendMessageGlobal() {
            const message = chatInputGlobal.value.trim();

            if (message === '') return;

            // Añadir mensaje del usuario a la UI y guardar
            addMessageToDOM(message, 'user');
            chatInputGlobal.value = '';

            // Verificar si estamos en el flujo de creación de tickets
            if (ticketFlow.active) {
                await processTicketFlow(message);
                return;
            }

            // Verificar si el usuario quiere crear un ticket
            if (message.toLowerCase().includes('crear ticket') || message.toLowerCase().includes('nuevo ticket')) {
                await startTicketFlow();
                return;
            }

            // Mostrar indicador de escritura
            const typingIndicator = addMessageToDOM('Escribiendo...', 'bot', false);
            
            try {
                // Llamar al endpoint del backend
                const response = await fetch('/dev/soporte/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrfHeaderGlobal && csrfTokenGlobal ? { [csrfHeaderGlobal]: csrfTokenGlobal } : {})
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Eliminar indicador de escritura
                typingIndicator.remove();
                
                // Añadir respuesta del bot y guardar
                addMessageToDOM(data.reply || 'Lo siento, no pude procesar tu mensaje.', 'bot');
                
                // Sugerir crear ticket si es apropiado
                if (message.toLowerCase().includes('problema') || message.toLowerCase().includes('error') || 
                    message.toLowerCase().includes('ayuda') || message.toLowerCase().includes('ticket')) {
                    setTimeout(() => {
                        addMessageToDOM('Si necesitas ayuda específica, puedo crear un ticket de soporte para ti. Solo escribe "<strong>crear ticket</strong>".', 'bot');
                    }, 1000);
                }
                
            } catch (error) {
                console.error('Error al comunicarse con el chatbot:', error);
                typingIndicator.remove();
                addMessageToDOM('Lo siento, hubo un error al procesar tu mensaje. Por favor, intenta de nuevo.', 'bot');
            }
        }

        // Iniciar flujo de creación de ticket
        async function startTicketFlow() {
            const loadingMsg = addMessageToDOM('Cargando información necesaria...', 'bot', false);
            
            // Cargar lista de APIs
            try {
                const response = await fetch('/dev/soporte/chatbot/apis', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrfHeaderGlobal && csrfTokenGlobal ? { [csrfHeaderGlobal]: csrfTokenGlobal } : {})
                    }
                });
                
                loadingMsg.remove();
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('📡 Respuesta de APIs:', data);
                    
                    if (data.success && data.apis && data.apis.length > 0) {
                        ticketFlow.apis = data.apis;
                        ticketFlow.active = true;
                        ticketFlow.step = 1;
                        ticketFlow.data = {};
                        
                        addMessageToDOM('¡Perfecto! Voy a ayudarte a crear un ticket de soporte. 🎫<br><br><strong>Paso 1 de 3: Asunto del ticket</strong><br><br>¿Cuál es el asunto o título del problema? (Máximo 150 caracteres)', 'bot');
                    } else {
                        addMessageToDOM('❌ No se pudieron cargar las APIs disponibles. Por favor, intenta crear el ticket manualmente desde la <a href="/dev/soporte/nuevo-ticket">sección de Soporte</a>.', 'bot');
                    }
                } else {
                    throw new Error('Error en la respuesta del servidor');
                }
            } catch (error) {
                console.error('❌ Error al cargar APIs:', error);
                loadingMsg.remove();
                addMessageToDOM('❌ Error al cargar las APIs. Por favor, intenta crear el ticket manualmente desde la <a href="/dev/soporte/nuevo-ticket">sección de Soporte</a>.', 'bot');
            }
        }

        // Procesar el flujo de creación de ticket
        async function processTicketFlow(message) {
            switch(ticketFlow.step) {
                case 1: // Asunto
                    if (message.length > 150) {
                        addMessageToDOM('El asunto es demasiado largo. Por favor, usa máximo 150 caracteres.', 'bot');
                        return;
                    }
                    ticketFlow.data.asunto = message;
                    ticketFlow.step = 2;
                    
                    // Verificar que haya APIs cargadas
                    if (!ticketFlow.apis || ticketFlow.apis.length === 0) {
                        addMessageToDOM('❌ Error: No hay APIs disponibles. Por favor, intenta crear el ticket manualmente.', 'bot');
                        ticketFlow.active = false;
                        return;
                    }
                    
                    // Mostrar opciones de API
                    let apisHTML = '<strong>Paso 2 de 3: API relacionada</strong><br><br>Selecciona el número de la API relacionada con tu ticket:<br><br>';
                    ticketFlow.apis.forEach((api, index) => {
                        apisHTML += `<strong>${index + 1}.</strong> ${api.nombre}<br>`;
                    });
                    apisHTML += '<br>Escribe el número de la API:';
                    
                    console.log('📝 APIs disponibles:', ticketFlow.apis);
                    addMessageToDOM(apisHTML, 'bot');
                    break;
                    
                case 2: // Selección de API
                    const apiIndex = parseInt(message) - 1;
                    if (isNaN(apiIndex) || apiIndex < 0 || apiIndex >= ticketFlow.apis.length) {
                        addMessageToDOM('Por favor, selecciona un número válido de la lista.', 'bot');
                        return;
                    }
                    const selectedApi = ticketFlow.apis[apiIndex];
                    console.log('🎯 API seleccionada:', selectedApi);
                    console.log('🔑 ID de API:', selectedApi.id, 'Tipo:', typeof selectedApi.id);
                    ticketFlow.data.idApi = selectedApi.id;
                    ticketFlow.data.apiNombre = selectedApi.nombre;
                    ticketFlow.step = 3;
                    
                    addMessageToDOM(`<strong>Paso 3 de 3: Descripción detallada</strong><br><br>Describe el problema o consulta en detalle. Incluye toda la información relevante:`, 'bot');
                    break;
                    
                case 3: // Descripción
                    ticketFlow.data.descripcion = message;
                    
                    // Mostrar resumen y confirmar
                    const resumenHTML = `
                        <strong>📋 Resumen del ticket:</strong><br><br>
                        <strong>Asunto:</strong> ${ticketFlow.data.asunto}<br>
                        <strong>API:</strong> ${ticketFlow.data.apiNombre}<br>
                        <strong>Descripción:</strong> ${ticketFlow.data.descripcion.substring(0, 100)}${ticketFlow.data.descripcion.length > 100 ? '...' : ''}<br><br>
                        ¿Confirmas la creación del ticket? Escribe "<strong>sí</strong>" para confirmar o "<strong>no</strong>" para cancelar.
                    `;
                    ticketFlow.step = 4;
                    addMessageToDOM(resumenHTML, 'bot');
                    break;
                    
                case 4: // Confirmación
                    if (message.toLowerCase() === 'sí' || message.toLowerCase() === 'si') {
                        await createTicket();
                    } else {
                        ticketFlow.active = false;
                        ticketFlow.step = 0;
                        addMessageToDOM('Creación de ticket cancelada. ¿En qué más puedo ayudarte?', 'bot');
                    }
                    break;
            }
        }

        // Crear el ticket en la base de datos
        async function createTicket() {
            console.log('📤 Datos del ticket a enviar:', ticketFlow.data);
            console.log('📤 ID API:', ticketFlow.data.idApi, 'Tipo:', typeof ticketFlow.data.idApi);
            
            const typingIndicator = addMessageToDOM('Creando tu ticket...', 'bot', false);
            
            try {
                const ticketPayload = {
                    asunto: ticketFlow.data.asunto,
                    idApi: ticketFlow.data.idApi,
                    descripcion: ticketFlow.data.descripcion,
                    infoAdicional: 'Ticket creado a través del chatbot'
                };
                
                console.log('📨 Payload final:', JSON.stringify(ticketPayload, null, 2));
                
                const response = await fetch('/dev/soporte/chatbot/crear-ticket', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrfHeaderGlobal && csrfTokenGlobal ? { [csrfHeaderGlobal]: csrfTokenGlobal } : {})
                    },
                    body: JSON.stringify(ticketPayload)
                });
                
                typingIndicator.remove();
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        addMessageToDOM(`✅ <strong>¡Ticket creado exitosamente!</strong><br><br>Nuestro equipo de soporte revisará tu consulta pronto. Puedes ver el estado de tus tickets en la sección de Soporte.`, 'bot');
                    } else {
                        addMessageToDOM(`❌ Error al crear el ticket: ${data.error}<br><br>Por favor, intenta crear el ticket manualmente desde la sección de Soporte.`, 'bot');
                    }
                } else {
                    throw new Error('Error en la respuesta del servidor');
                }
                
            } catch (error) {
                console.error('Error al crear ticket:', error);
                typingIndicator.remove();
                addMessageToDOM('❌ Hubo un error al crear el ticket. Por favor, intenta crear el ticket manualmente desde la sección de Soporte.', 'bot');
            } finally {
                // Reiniciar el flujo
                ticketFlow.active = false;
                ticketFlow.step = 0;
                ticketFlow.data = {};
            }
        }

        // Función mejorada para agregar mensajes al DOM
        function addMessageToDOM(text, sender, saveHistory = true) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message-global', `message-${sender}-global`);
            messageElement.innerHTML = text;

            chatMessagesGlobal.appendChild(messageElement);
            chatMessagesGlobal.scrollTop = chatMessagesGlobal.scrollHeight;
            
            // Guardar en sessionStorage si es necesario
            if (saveHistory) {
                saveChatHistory();
            }
            
            return messageElement;
        }

        // Limpiar historial al hacer logout
        const logoutButtons = document.querySelectorAll('a[href*="logout"], button[onclick*="logout"]');
        logoutButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                sessionStorage.removeItem(CHAT_STORAGE_KEY);
            });
        });

        const logoutForm = document.querySelector('form[action*="logout"]');
        if (logoutForm) {
            logoutForm.addEventListener('submit', function() {
                sessionStorage.removeItem(CHAT_STORAGE_KEY);
            });
        }
    })();
</script>
</div>
</body>
</html>
