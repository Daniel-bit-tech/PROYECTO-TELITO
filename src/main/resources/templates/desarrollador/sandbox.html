<!doctype html>

<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>TELITO DEVELOPER PORTAL | API Sandbox</title>

    <link href="/tabler/dist/css/tabler.css" rel="stylesheet"/>
    <link href="/tabler/dist/css/tabler-vendors.css" rel="stylesheet"/>
    <link href="/tabler/preview/css/demo.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .sandbox-container { display: grid; grid-template-columns: 350px 1fr; gap: 1.5rem; align-items: flex-start; }
        @media (max-width: 992px) { .sandbox-container { grid-template-columns: 1fr; } }
        .endpoints-list .list-group-item { cursor: pointer; }
        .endpoints-list .list-group-item:hover { background-color: var(--tblr-bg-surface-secondary); }
        .endpoint-method { font-weight: 600; width: 70px; text-align: right; margin-right: 0.5rem; }
        .method-get { color: var(--tblr-green); }
        .method-post { color: var(--tblr-orange); }
        .method-put { color: var(--tblr-blue); }
        .method-delete { color: var(--tblr-red); }
        #response-body { background-color: #f5f7fb; border: 1px solid var(--tblr-border-color); padding: 1rem; border-radius: 4px; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow-y: auto; }
        #request-body{ min-height: 200px; }
    </style>
</head>

<body>
<script src="/tabler/dist/js/tabler-theme.min.js"></script>

<div class="page">
    <div th:replace="~{desarrollador/header :: header}"></div>

    <div class="page-wrapper">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <h2 class="page-title">API Sandbox / Playground</h2>
            </div>
        </div>
        <div class="page-body">
            <div class="container-xl">
                <div id="sandbox-main">
                    <div class="sandbox-container">
                        <div>
                            <div class="card mb-3">
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">API Seleccionada</label>
                                        <div id="api-name-display" class="form-control-plaintext fw-bold">Cargando...</div>
                                    </div>
                                    <div>
                                        <label class="form-label">Entorno de Prueba</label>
                                        <select id="environment-select" class="form-select"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="card">
                                <div class="card-header"><h3 class="card-title">Endpoints</h3></div>
                                <div id="endpoints-list" class="list-group list-group-flush"><div class="p-3 text-muted">Cargando...</div></div>
                            </div>
                        </div>

                        <div>
                            <div id="request-response-container" style="display: none;">
                                <div class="card">
                                    <div class="card-header"><h3 class="card-title">Petición (Request)</h3></div>
                                    <div class="card-body">
                                        <div class="input-group mb-3">
                                            <span id="request-method" class="input-group-text">GET</span>
                                            <input type="text" id="request-url" class="form-control" readonly>
                                        </div>
                                        <ul class="nav nav-tabs" data-bs-toggle="tabs">
                                            <li class="nav-item"><a href="#tabs-params" class="nav-link active" data-bs-toggle="tab">Params</a></li>
                                            <li class="nav-item"><a href="#tabs-headers" class="nav-link" data-bs-toggle="tab">Headers</a></li>
                                            <li class="nav-item"><a href="#tabs-body" class="nav-link" data-bs-toggle="tab">Body</a></li>
                                        </ul>
                                        <div class="tab-content">
                                            <div class="tab-pane active show" id="tabs-params"><div id="params-container" class="p-3"></div></div>
                                            <div class="tab-pane" id="tabs-headers"><div id="headers-container" class="p-3"></div></div>
                                            <div class="tab-pane" id="tabs-body"><textarea id="request-body" class="form-control mt-3" rows="8"></textarea></div>
                                        </div>
                                    </div>
                                    <div class="card-footer text-end">
                                        <button id="send-request-btn" class="btn btn-primary"><i class="fas fa-paper-plane me-2"></i>Enviar</button>
                                    </div>
                                </div>
                                <div id="response-panel" class="card mt-3" style="display: none;">
                                    <div class="card-header">
                                        <h3 class="card-title">Respuesta (Response)</h3>
                                        <div class="ms-auto">
                                            <span class="badge" id="response-status"></span>
                                            <span class="ms-2 text-muted" id="response-time"></span>
                                        </div>
                                    </div>
                                    <div class="card-body"><pre><code id="response-body"></code></pre></div>
                                </div>
                            </div>
                            <div id="welcome-message" class="card card-body text-center">
                                <p class="h3">Bienvenido al Sandbox</p>
                                <p class="text-muted">Selecciona un endpoint para comenzar.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="error-message" class="alert alert-danger" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        let apiId = urlParams.get('api');
        let entorno = urlParams.get('env');

        console.log('🔍 Parámetros de URL:', { apiId, entorno });

        // Validar y corregir el entorno si es undefined
        if (!entorno || entorno === 'undefined' || entorno === 'null') {
            console.warn('Entorno no especificado o es undefined, usando valor por defecto: development');
            entorno = 'development';

            // Opcional: actualizar la URL en el navegador sin recargar
            const nuevaUrl = `${window.location.pathname}?api=${apiId}&env=${entorno}`;
            window.history.replaceState({}, '', nuevaUrl);
        }

        if (apiId) {
            loadApiData(apiId, entorno);
            sessionStorage.setItem('sandboxApiId', apiId);
            sessionStorage.setItem('sandboxEnv', entorno);
        } else {
            apiId = sessionStorage.getItem('sandboxApiId');
            entorno = sessionStorage.getItem('sandboxEnv') || 'development';
        }

        if (apiId) {
            loadApiData(apiId, entorno);
        } else {
            showError('No se especificó una API. Por favor, accede al Sandbox desde la página de "Onboarding Técnico".');
            document.getElementById('sandbox-main').style.display = 'none';
        }
    });

    let currentApiSpec = null;
    let selectedEndpoint = {};

    function showError(message) {
        document.getElementById('welcome-message').style.display = 'none';
        const errorContainer = document.getElementById('error-message');
        errorContainer.textContent = message;
        errorContainer.style.display = 'block';
    }

    async function loadApiData(apiId, entornoSeleccionado) {
        try {
            const response = await fetch(`/api/sandbox/api-details/${apiId}`);
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'No se pudo cargar la información de la API.');
            }
            const apiData = await response.json();

            currentApiSpec = apiData.spec;
            document.getElementById('api-name-display').textContent = apiData.nombre;

            const envSelect = document.getElementById('environment-select');
            envSelect.innerHTML = '';
            apiData.entornos.forEach(env => {
                const option = new Option(env.nombre, env.url_base);
                envSelect.appendChild(option);
            });
            if (entornoSeleccionado) {
                const optionToSelect = Array.from(envSelect.options).find(opt => opt.text.toLowerCase().includes(entornoSeleccionado));
                if (optionToSelect) {
                    envSelect.value = optionToSelect.value;
                }
            }
            renderEndpointsList(currentApiSpec);
        } catch (error) {
            showError(error.message);
        }
    }

    function renderEndpointsList(spec) {
        const container = document.getElementById('endpoints-list');
        container.innerHTML = '';
        if (!spec || !spec.paths) {
            container.innerHTML = '<div class="p-3 text-muted">No hay endpoints definidos para esta API.</div>';
            return;
        }
        for (const path in spec.paths) {
            for (const method in spec.paths[path]) {
                const endpointDiv = document.createElement('div');
                endpointDiv.className = 'list-group-item';
                endpointDiv.onclick = () => selectEndpoint(path, method);
                endpointDiv.innerHTML = `<div class="d-flex align-items-center"><span class="endpoint-method method-${method}">${method.toUpperCase()}</span><span class="flex-fill">${path}</span></div>`;
                container.appendChild(endpointDiv);
            }
        }
    }

    function selectEndpoint(path, method) {
        document.getElementById('welcome-message').style.display = 'none';
        document.getElementById('request-response-container').style.display = 'block';
        document.getElementById('response-panel').style.display = 'none';

        selectedEndpoint = { path, method, details: currentApiSpec.paths[path][method] };

        const methodBadge = document.getElementById('request-method');
        methodBadge.textContent = method.toUpperCase();
        methodBadge.className = `input-group-text method-${method}`;
        document.getElementById('request-url').value = path;

        const paramsContainer = document.getElementById('params-container');
        paramsContainer.innerHTML = '<h5>Parámetros</h5>';
        if (selectedEndpoint.details.parameters?.length > 0) {
            selectedEndpoint.details.parameters.forEach(p => {
                paramsContainer.innerHTML += `<div class="mb-2"><label class="form-label">${p.name} <span class="badge bg-secondary-lt">${p.in}</span></label><input type="text" class="form-control" data-param-name="${p.name}" data-param-in="${p.in}" placeholder="${p.schema.type}"></div>`;
            });
        } else {
            paramsContainer.innerHTML += '<p class="text-muted">Este endpoint no tiene parámetros.</p>';
        }

        const bodyTextarea = document.getElementById('request-body');
        bodyTextarea.disabled = !selectedEndpoint.details.requestBody;
        bodyTextarea.value = selectedEndpoint.details.requestBody ? JSON.stringify({}, null, 2) : '';


        const headersContainer = document.getElementById('headers-container');
        headersContainer.innerHTML = '<h5>Cabeceras (Headers)</h5>';


        headersContainer.innerHTML += `
        <div class="mb-2">
            <label class="form-label">Content-Type</label>
            <input type="text" class="form-control" value="application/json" data-header-name="Content-Type">
        </div>
    `;
        headersContainer.innerHTML += `
        <div class="mb-2">
            <label class="form-label">Authorization</label>
            <input type="text" class="form-control" data-header-name="Authorization" placeholder="El API Key se añade automáticamente en el backend">
        </div>
    `;

    }

    document.getElementById('send-request-btn').addEventListener('click', async () => {
        const btn = document.getElementById('send-request-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

        const baseUrl = document.getElementById('environment-select').value;
        let finalUrl = baseUrl + selectedEndpoint.path;
        const urlParams = new URLSearchParams();

        document.querySelectorAll('#params-container input').forEach(input => {
            if (input.value) {
                if (input.dataset.paramIn === 'path') {
                    finalUrl = finalUrl.replace(`{${input.dataset.paramName}}`, encodeURIComponent(input.value));
                } else if (input.dataset.paramIn === 'query') {
                    urlParams.append(input.dataset.paramName, input.value);
                }
            }
        });

        const queryString = urlParams.toString();
        if (queryString) {
            finalUrl += '?' + queryString;
        }

        const requestData = {
            apiId: parseInt(new URLSearchParams(window.location.search).get('api')),
            method: selectedEndpoint.method.toUpperCase(),
            targetUrl: finalUrl,
            headers: {'Content-Type': 'application/json'},
            body: selectedEndpoint.details.requestBody ? document.getElementById('request-body').value : null
        };

        try {
            const response = await fetch('/api/sandbox/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });
            const result = await response.json();
            displayResponse(result);
        } catch (error) {
            displayResponse({ status: 'ERROR', time: 0, body: JSON.stringify({ error: error.message }, null, 2) });
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Enviar';
        }
    });

    function displayResponse(result) {
        const responsePanel = document.getElementById('response-panel');
        responsePanel.style.display = 'block';
        const statusBadge = document.getElementById('response-status');
        statusBadge.textContent = `Status: ${result.status}`;
        statusBadge.className = `badge ${result.status >= 200 && result.status < 300 ? 'bg-success' : 'bg-danger'}`;
        document.getElementById('response-time').textContent = `${result.time} ms`;
        try {
            document.getElementById('response-body').textContent = JSON.stringify(JSON.parse(result.body), null, 2);
        } catch (e) {
            document.getElementById('response-body').textContent = result.body;
        }
    }
</script>

<script src="/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/tabler/dist/js/tabler.min.js"></script>
</body>
</html>
