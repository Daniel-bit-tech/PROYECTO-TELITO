<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TELITO PORTAL | Gestión de API</title>
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <link href="/tabler/dist/css/tabler.css" rel="stylesheet"/>
  <link href="/tabler/dist/css/tabler-flags.css" rel="stylesheet"/>
  <link href="/tabler/dist/css/tabler-vendors.css" rel="stylesheet"/>
  <link href="/tabler/dist/css/tabler-themes.css" rel="stylesheet"/>
  <link href="/tabler/preview/css/demo.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/tabler/dist/js/tabler-theme.min.js"></script>
</head>
<body>
<div class="page">

  <div th:replace="desarrollador/header.html :: header"></div>

  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
        <div class="row">

          <!-- Sidebar -->
          <div class="col-lg-2">
            <div th:replace="desarrollador/interno/gestionSidebar :: gestionApi-sidebar(${api.idApi}, ${currentView}, ${subView})"></div>
          </div>

          <div class="col-lg-10">
            <!-- Header secundario dinámico -->
            <div th:replace="desarrollador/interno/gestionSidebar :: gestionApi-navbar(${api.idApi}, ${currentView}, ${subView})"></div>

            <!-- Contenedor dinámico -->
            <div id="content-area" class="mt-3">
              <!-- Aquí se cargan las vistas parciales vía fetch -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", () => {
    const idApi = [[${api.idApi}]];
    const tabs = document.querySelectorAll("[data-section]");
    const contentArea = document.getElementById("content-area");
    const themeToggle = document.querySelector('[data-bs-toggle="theme"]');

    // Función para cargar secciones dinámicamente
    function loadSection(section) {
      fetch(`/dev/int/misApis/${idApi}/section/${section}`)
              .then(res => res.text())
              .then(html => {
                contentArea.innerHTML = html;
                localStorage.setItem("lastSection", section);
              })
              .catch(() => {
                contentArea.innerHTML = "<div class='alert alert-danger'>Error cargando sección</div>";
              });
    }

    // Restaurar última sección
    const lastSection = localStorage.getItem("lastSection");
    if (lastSection) {
      const lastTab = document.querySelector(`[data-section="${lastSection}"]`);
      if (lastTab) {
        tabs.forEach(t => t.classList.remove("active"));
        lastTab.classList.add("active");
        loadSection(lastSection);
      }
    } else if (tabs.length > 0) {
      const first = tabs[0];
      first.classList.add("active");
      loadSection(first.getAttribute("data-section"));
    }

    // Asignar eventos a tabs
    tabs.forEach(tab => {
      tab.addEventListener("click", e => {
        e.preventDefault();
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const section = tab.getAttribute("data-section");
        loadSection(section);
      });
    });
  });
</script>
</body>
</html>
