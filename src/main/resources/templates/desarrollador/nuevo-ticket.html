<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>TELITO DEVELOPER PORTAL | Nuevo Ticket</title>
    <link href="/tabler/dist/css/tabler.css?1757307620" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="page">
    <header class="navbar navbar-expand-md d-print-none" style="background: #fff; border-bottom: 1px solid #e6e7e9;">
        <div class="container-xl">
            <a href="/dev/soporte" class="navbar-brand">
                <i class="fas fa-arrow-left me-2"></i>
                Volver a Soporte
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">TELITO Developer Portal</span>
            </div>
        </div>
    </header>
    <div class="page-wrapper">
        <div class="page-body">
            <div class="container-xl">
                <div class="row justify-content-center mt-4">
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title">
                                    <i class="fas fa-ticket-alt me-2"></i>
                                    Crear Nuevo Ticket de Soporte
                                </h2>
                            </div>
                            <div class="card-body">
                                <form action="/dev/soporte/crear-ticket" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <div class="mb-3">
                                        <label class="form-label required">Asunto</label>
                                        <input type="text" class="form-control" name="asunto" placeholder="Breve descripción del problema" required maxlength="150" />
                                        <small class="form-hint">Máximo 150 caracteres</small>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label required">API Relacionada</label>
                                        <select class="form-select" name="idApi" required>
                                            <option value="">Selecciona una API...</option>
                                            <option th:each="api : ${apis}" th:value="${api.idApi}" th:text="${api.nombre} + ' - ' + ${api.descripcion}">API Name</option>
                                        </select>
                                        <small class="form-hint">Selecciona la API relacionada con tu consulta</small>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label required">Descripción Detallada</label>
                                        <textarea class="form-control" name="descripcion" rows="6" placeholder="Describe el problema en detalle..." required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Información Adicional (Opcional)</label>
                                        <textarea class="form-control" name="infoAdicional" rows="3" placeholder="Logs, capturas de pantalla, etc."></textarea>
                                    </div>
                                    <div class="alert alert-info">
                                        <h4 class="alert-title"><i class="fas fa-lightbulb me-2"></i>Consejos</h4>
                                        <ul class="mb-0">
                                            <li>Sé específico sobre el problema</li>
                                            <li>Incluye mensajes de error completos</li>
                                        </ul>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-paper-plane me-2"></i>Enviar Ticket
                                        </button>
                                        <a href="/dev/soporte" class="btn btn-outline-secondary">
                                            <i class="fas fa-times me-2"></i>Cancelar
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{desarrollador/footer :: footer}"></div>
</div>
<script th:src="|/tabler/dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js?1757307620|"></script>
<script th:src="|/tabler/dist/js/tabler.min.js?1757307620|"></script>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
    console.log('Formulario enviándose...');
    console.log('Asunto:', document.querySelector('[name="asunto"]').value);
    console.log('API:', document.querySelector('[name="idApi"]').value);
    console.log('Descripción:', document.querySelector('[name="descripcion"]').value);
});
</script>
</body>
</html>
