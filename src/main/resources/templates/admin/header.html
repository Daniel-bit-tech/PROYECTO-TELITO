<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telito Admin Portal</title>
    
    <!-- Script para aplicar tema inmediatamente antes de que se renderice la página -->
    <script>
        (function() {
            console.log('⚡ Aplicando tema inicial inmediatamente...');
            try {
                const systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                const savedTheme = localStorage.getItem('theme') || systemTheme;
                
                console.log('  - Tema del sistema:', systemTheme);
                console.log('  - Tema guardado:', savedTheme);
                console.log('  - Aplicando:', savedTheme);
                
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                document.documentElement.className = 'theme-' + savedTheme;
                
                console.log('✅ Tema inicial aplicado:', savedTheme);
            } catch (error) {
                console.error('❌ Error al aplicar tema inicial:', error);
            }
        })();
    </script>
    
    <!-- Control de caché y seguridad -->
    <div th:replace="~{components/security-cache-control :: security-cache-control}"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-color: #8b7bd8;
            --light-bg: #f8f9fa;
            --dark-bg: #212529;
            --text-light: #f8f9fa;
            --text-dark: #212529;
            --transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--primary-color) !important;
            transition: var(--transition);
        }

        .navbar-brand:hover {
            color: var(--secondary-color) !important;
            transform: translateY(-1px);
        }

        .navbar-brand svg {
            transition: var(--transition);
        }

        .navbar-brand:hover svg {
            transform: rotate(15deg);
        }

        .custom-navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);

            padding: 0.5rem 0;

        }

        .nav-link:hover {
            color: white !important;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: white;
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 70%;
        }

        .nav-link.active {
            color: white !important;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-link.active::after {

        }

        .nav-link-icon {

        .nav-link:hover .nav-link-icon {

        .notification-badge {

        .user-avatar {

            pointer-events: auto !important;
        }

        .user-avatar {
            cursor: pointer !important;
            pointer-events: auto !important;
        }
        
        .nav-item.dropdown {
            position: relative;
            z-index: 1000;
        }
        
        .dropdown-toggle::after {
            display: none;
        }

        .theme-switcher {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            border: none;
            cursor: pointer;

            transform: rotate(15deg);
        }

            border-radius: 10px;
            overflow: hidden;
        }

        .notification-item {
            padding: 0.75rem 1rem;

            margin-bottom: 0.5rem;

        }

        .notification-item:hover {

        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-dot-animated {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

<script>
    // Nota: Bootstrap se carga al final de cada página específica (dashboard, gestion-usuarios, etc.)
    // Este header solo define la estructura HTML del navbar

    // Sistema mejorado de cambio de tema - VERSIÓN ROBUSTA
    function initThemeSystem() {
        console.log('🎨 === INICIANDO SISTEMA DE TEMA ===');
        
        // Detectar tema del sistema
        const systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const savedTheme = localStorage.getItem('theme') || systemTheme;
        
        console.log('📊 Estado inicial:');
        console.log('  - Tema del sistema:', systemTheme);
        console.log('  - Tema guardado:', localStorage.getItem('theme'));
        console.log('  - Tema a aplicar:', savedTheme);
        
        // Buscar botones
        const darkBtn = document.getElementById('themeDarkBtn');
        const lightBtn = document.getElementById('themeLightBtn');
        
        console.log('🔍 Elementos encontrados:');
        console.log('  - Botón oscuro:', darkBtn ? '✅ Encontrado' : '❌ No encontrado');
        console.log('  - Botón claro:', lightBtn ? '✅ Encontrado' : '❌ No encontrado');
        
        if (!darkBtn || !lightBtn) {
            console.error('❌ ERROR: No se encontraron los botones de tema');
            console.error('  - darkBtn:', darkBtn);
            console.error('  - lightBtn:', lightBtn);
            
            // Intentar buscar de otra manera
            const allButtons = document.querySelectorAll('.theme-switcher');
            console.log('🔄 Buscando botones por clase, encontrados:', allButtons.length);
            allButtons.forEach((btn, index) => {
                console.log(`  - Botón ${index}:`, btn.id, btn);
            });
            
            return; // Salir si no se encuentran los botones
        }
        
        // Aplicar tema inicial
        setTheme(savedTheme);
        updateThemeButtons(savedTheme);
        
        // Configurar event listeners con manejo de errores robusto
        try {
            darkBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('🌙 === CLICK BOTÓN OSCURO ===');
                setTheme('dark');
                updateThemeButtons('dark');
            });
            console.log('✅ Event listener agregado al botón oscuro');
        } catch (error) {
            console.error('❌ Error al agregar listener al botón oscuro:', error);
        }
        
        try {
            lightBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('☀️ === CLICK BOTÓN CLARO ===');
                setTheme('light');
                updateThemeButtons('light');
            });
            console.log('✅ Event listener agregado al botón claro');
        } catch (error) {
            console.error('❌ Error al agregar listener al botón claro:', error);
        }
        
        // Escuchar cambios en el tema del sistema
        try {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    const newTheme = e.matches ? 'dark' : 'light';
                    console.log('🔄 Cambio de tema del sistema detectado:', newTheme);
                    setTheme(newTheme);
                    updateThemeButtons(newTheme);
                }
            });
        } catch (error) {
            console.error('❌ Error al configurar listener del sistema:', error);
        }
        
        // Escuchar eventos de cambio de tema desde otras páginas
        try {
            window.addEventListener('themeChanged', function(event) {
                console.log('📢 Evento de cambio de tema recibido:', event.detail.theme);
                updateThemeButtons(event.detail.theme);
            });
        } catch (error) {
            console.error('❌ Error al configurar listener de eventos:', error);
        }
        
        console.log('✅ === SISTEMA DE TEMA INICIALIZADO CORRECTAMENTE ===');
    }
    
    // Función para establecer el tema - VERSIÓN ROBUSTA
    function setTheme(theme) {
        console.log('🎨 === APLICANDO TEMA ===');
        console.log('  - Tema solicitado:', theme);
        
        // Validar tema
        if (theme !== 'light' && theme !== 'dark') {
            console.warn('⚠️ Tema inválido:', theme, 'usando dark por defecto');
            theme = 'dark';
        }
        
        try {
            // Verificar elementos antes de aplicar
            const htmlElement = document.documentElement;
            const bodyElement = document.body;
            
            console.log('📋 Estado antes del cambio:');
            console.log('  - HTML data-bs-theme:', htmlElement.getAttribute('data-bs-theme'));
            console.log('  - Body data-bs-theme:', bodyElement.getAttribute('data-bs-theme'));
            
            // Aplicar el tema a los elementos principales
            htmlElement.setAttribute('data-bs-theme', theme);
            bodyElement.setAttribute('data-bs-theme', theme);
            
            // Guardar en localStorage
            localStorage.setItem('theme', theme);
            
            console.log('📋 Estado después del cambio:');
            console.log('  - HTML data-bs-theme:', htmlElement.getAttribute('data-bs-theme'));
            console.log('  - Body data-bs-theme:', bodyElement.getAttribute('data-bs-theme'));
            console.log('  - LocalStorage theme:', localStorage.getItem('theme'));
            
            // Aplicar estilos específicos del navbar
            applyNavbarColors(theme);
            
            // Emitir evento para otras páginas
            const event = new CustomEvent('themeChanged', { 
                detail: { theme: theme },
                bubbles: true,
                cancelable: true
            });
            window.dispatchEvent(event);
            
            console.log('✅ Tema aplicado exitosamente:', theme);
            console.log('📢 Evento themeChanged emitido');
            
        } catch (error) {
            console.error('❌ Error al aplicar tema:', error);
        }
    }
    
    // Función para actualizar la visibilidad de los botones de tema - VERSIÓN ROBUSTA
    function updateThemeButtons(theme) {
        console.log('🔄 === ACTUALIZANDO BOTONES DE TEMA ===');
        console.log('  - Tema:', theme);
        
        try {
            const darkBtn = document.getElementById('themeDarkBtn');
            const lightBtn = document.getElementById('themeLightBtn');
            
            console.log('🔍 Estado de botones:');
            console.log('  - darkBtn encontrado:', darkBtn ? '✅' : '❌', darkBtn);
            console.log('  - lightBtn encontrado:', lightBtn ? '✅' : '❌', lightBtn);
            
            if (!darkBtn || !lightBtn) {
                console.error('❌ ERROR: No se encontraron los botones para actualizar');
                return;
            }
            
            // Mostrar el estado actual
            console.log('📋 Estado actual:');
            console.log('  - darkBtn display:', window.getComputedStyle(darkBtn).display);
            console.log('  - lightBtn display:', window.getComputedStyle(lightBtn).display);
            
            if (theme === 'dark') {
                // En modo oscuro, mostrar botón de modo claro
                darkBtn.style.display = 'none';
                lightBtn.style.display = 'flex';
                darkBtn.style.visibility = 'hidden';
                lightBtn.style.visibility = 'visible';
                console.log('✅ Configurado para modo oscuro: mostrando botón claro');
            } else {
                // En modo claro, mostrar botón de modo oscuro
                darkBtn.style.display = 'flex';
                lightBtn.style.display = 'none';
                darkBtn.style.visibility = 'visible';
                lightBtn.style.visibility = 'hidden';
                console.log('✅ Configurado para modo claro: mostrando botón oscuro');
            }
            
            // Verificar el resultado
            console.log('� Estado final:');
            console.log('  - darkBtn display:', window.getComputedStyle(darkBtn).display);
            console.log('  - lightBtn display:', window.getComputedStyle(lightBtn).display);
            console.log('  - darkBtn visibility:', window.getComputedStyle(darkBtn).visibility);
            console.log('  - lightBtn visibility:', window.getComputedStyle(lightBtn).visibility);
            
        } catch (error) {
            console.error('❌ Error al actualizar botones:', error);
        }
        
        console.log('✅ === BOTONES ACTUALIZADOS ===');
    }
    
    // Función para aplicar colores del navbar según el tema
    function applyNavbarColors(theme) {
        console.log('🎨 Aplicando colores de navbar para tema:', theme);
        
        const navbarBrand = document.querySelector('.navbar-brand');
        const navLinks = document.querySelectorAll('.nav-link');
        const dropdownToggle = document.querySelector('.dropdown-toggle');
        const userInfo = document.querySelector('.user-info');
        const navbarBrandLink = document.querySelector('.navbar-brand-link');
        
        if (theme === 'light') {
            // Modo claro - texto oscuro
            if (navbarBrand) {
                navbarBrand.style.color = '#212529';
                const brandSpan = navbarBrand.querySelector('span');
                if (brandSpan) brandSpan.style.color = '#212529';
            }
            
            if (navbarBrandLink) {
                navbarBrandLink.style.color = '#212529';
            }
            
            navLinks.forEach(link => {
                if (!link.closest('.theme-switcher')) {
                    link.style.color = 'rgba(33, 37, 41, 0.85)';
                }
            });
            
            if (dropdownToggle) {
                dropdownToggle.style.color = '#212529';
            }
            
            if (userInfo) {
                userInfo.style.color = '#212529';
                const userInfoDivs = userInfo.querySelectorAll('div');
                userInfoDivs.forEach(div => {
                    div.style.color = '#212529';
                });
            }
        } else {
            // Modo oscuro - texto blanco
            if (navbarBrand) {
                navbarBrand.style.color = 'white';
                const brandSpan = navbarBrand.querySelector('span');
                if (brandSpan) brandSpan.style.color = 'white';
            }
            
            if (navbarBrandLink) {
                navbarBrandLink.style.color = 'white';
            }
            
            navLinks.forEach(link => {
                if (!link.closest('.theme-switcher')) {
                    link.style.color = 'rgba(255, 255, 255, 0.85)';
                }
            });
            
            if (dropdownToggle) {
                dropdownToggle.style.color = 'white';
            }
            
            if (userInfo) {
                userInfo.style.color = 'white';
                const userInfoDivs = userInfo.querySelectorAll('div');
                userInfoDivs.forEach(div => {
                    div.style.color = 'white';
                });
            }
        }
    }

    // === INICIALIZACIÓN ROBUSTA DEL SISTEMA DE TEMA ===
    console.log('🚀 === INICIANDO CARGA DEL SISTEMA DE TEMA ===');
    
    // Función para intentar inicializar el tema
    function tryInitTheme() {
        console.log('🔄 Intentando inicializar sistema de tema...');
        console.log('  - DOM readyState:', document.readyState);
        
        // Verificar si los elementos están disponibles
        const darkBtn = document.getElementById('themeDarkBtn');
        const lightBtn = document.getElementById('themeLightBtn');
        
        if (darkBtn && lightBtn) {
            console.log('✅ Elementos encontrados (código legacy desactivado)');
            return true;
        } else {
            console.log('⏳ Elementos no encontrados aún, esperando...');
            console.log('  - darkBtn:', darkBtn);
            console.log('  - lightBtn:', lightBtn);
            return false;
        }
    }
    
    // Intentar inicialización inmediata
    if (document.readyState === 'loading') {
        console.log('📄 DOM aún cargando, esperando DOMContentLoaded...');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOMContentLoaded disparado');
            setTimeout(tryInitTheme, 100);
        });
    } else {
        console.log('📄 DOM ya cargado, intentando inicialización inmediata...');
        if (!tryInitTheme()) {
            // Si falla, reintentar con delays
            setTimeout(tryInitTheme, 100);
        }
    }
    
    // Reintentos con delays progresivos como respaldo
    const retryDelays = [200, 500, 1000, 2000];
    retryDelays.forEach((delay, index) => {
        setTimeout(function() {
            console.log(`🔄 Reintento ${index + 1} después de ${delay}ms...`);
            tryInitTheme();
        }, delay);
    });
    
    // Listener adicional para cuando el window termine de cargar
    window.addEventListener('load', function() {
        console.log('🪟 Window load completado, reintentando inicialización...');
        setTimeout(tryInitTheme, 100);
    });
    
    console.log('🎯 Sistema de inicialización configurado');
    
    // === FUNCIONES GLOBALES PARA DEBUG ===
    // Función global para debuggear el tema desde la consola
    window.debugTheme = function() {
        console.log('🐛 === DEBUG DEL SISTEMA DE TEMA ===');
        
        const darkBtn = document.getElementById('themeDarkBtn');
        const lightBtn = document.getElementById('themeLightBtn');
        const htmlTheme = document.documentElement.getAttribute('data-bs-theme');
        const bodyTheme = document.body.getAttribute('data-bs-theme');
        const savedTheme = localStorage.getItem('theme');
        
        console.log('📊 Estado actual:');
        console.log('  - HTML theme:', htmlTheme);
        console.log('  - Body theme:', bodyTheme);
        console.log('  - LocalStorage theme:', savedTheme);
        console.log('  - Dark button:', darkBtn ? '✅ Encontrado' : '❌ No encontrado');
        console.log('  - Light button:', lightBtn ? '✅ Encontrado' : '❌ No encontrado');
        
        if (darkBtn) {
            console.log('  - Dark button display:', window.getComputedStyle(darkBtn).display);
            console.log('  - Dark button visibility:', window.getComputedStyle(darkBtn).visibility);
        }
        
        if (lightBtn) {
            console.log('  - Light button display:', window.getComputedStyle(lightBtn).display);
            console.log('  - Light button visibility:', window.getComputedStyle(lightBtn).visibility);
        }
        
        console.log('🔧 Funciones disponibles:');
        console.log('  - debugTheme() - Mostrar estado actual');
        console.log('  - forceTheme("dark") - Forzar tema oscuro');
        console.log('  - forceTheme("light") - Forzar tema claro');
        console.log('  - resetTheme() - Reinicializar sistema');
    };
    
    // Función para forzar un tema
    window.forceTheme = function(theme) {
        console.log('🔧 Forzando tema:', theme);
        if (typeof setTheme === 'function') {
            setTheme(theme);
            if (typeof updateThemeButtons === 'function') {
                updateThemeButtons(theme);
            }
        } else {
            console.error('❌ Función setTheme no disponible');
        }
    };
    
    // Función para reinicializar el sistema
    window.resetTheme = function() {
        console.log('🔄 Sistema legacy desactivado');
    };
    
    console.log('🐛 Funciones de debug registradas. Usa debugTheme() en la consola.');

    // === SISTEMA DE TEMA UNIFICADO Y SIMPLIFICADO ===
    (function() {
        console.log('🎨 Inicializando sistema de tema unificado...');
        
        // Detectar tema actual
        const systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const savedTheme = localStorage.getItem('theme') || systemTheme;
        
        // Función única para aplicar tema
        function applyTheme(theme) {
            console.log('🎨 Aplicando tema:', theme);
            
            // Aplicar atributos
            document.documentElement.setAttribute('data-bs-theme', theme);
            document.body.setAttribute('data-bs-theme', theme);
            
            // Guardar en localStorage
            localStorage.setItem('theme', theme);
            
            // Actualizar visibilidad de botones
            const darkBtn = document.getElementById('themeDarkBtn');
            const lightBtn = document.getElementById('themeLightBtn');
            
            if (darkBtn && lightBtn) {
                if (theme === 'dark') {
                    darkBtn.style.display = 'none';
                    lightBtn.style.display = 'flex';
                } else {
                    darkBtn.style.display = 'flex';
                    lightBtn.style.display = 'none';
                }
            }
            
            console.log('✅ Tema aplicado:', theme);
        }
        
        // Función de inicialización
        function initTheme() {
            console.log('🔧 Inicializando controles de tema...');
            
            const darkBtn = document.getElementById('themeDarkBtn');
            const lightBtn = document.getElementById('themeLightBtn');
            
            if (!darkBtn || !lightBtn) {
                console.warn('⚠️ Botones de tema no encontrados, reintentando...');
                return false;
            }
            
            // Limpiar listeners anteriores
            const newDarkBtn = darkBtn.cloneNode(true);
            const newLightBtn = lightBtn.cloneNode(true);
            darkBtn.parentNode.replaceChild(newDarkBtn, darkBtn);
            lightBtn.parentNode.replaceChild(newLightBtn, lightBtn);
            
            // Agregar event listeners
            newDarkBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                applyTheme('dark');
            });
            
            newLightBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                applyTheme('light');
            });
            
            // Aplicar tema inicial
            applyTheme(savedTheme);
            
            console.log('✅ Sistema de tema inicializado correctamente');
            return true;
        }
        
        // Intentar inicialización cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(initTheme, 50);
            });
        } else {
            setTimeout(initTheme, 50);
        }
        
        // Exponer función global para cambiar tema desde cualquier parte
        window.changeTheme = applyTheme;
        
    })();

    document.addEventListener("DOMContentLoaded", function() {
        let path = window.location.pathname;
        let page = path.substring(path.lastIndexOf("/") + 1);

        if (page === "" || page === "/") page = "admin.html";

        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            let href = link.getAttribute('href');
            if (!href) return;

            href = href.substring(href.lastIndexOf("/") + 1);

            if (href.replace(".html","") === page.replace(".html","") || 
                (path.includes('/admin/') && href.includes(page))) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    });
</script>
