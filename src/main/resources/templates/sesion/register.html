<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" crossorigin="">
  <link rel="stylesheet" th:href="@{/login/assets/css/styles.css}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

  <title>Registro - Telito</title>

  <style>

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .login__form {
      box-shadow: 0 0 20px rgba(128, 0, 128, 0.3),
      0 0 35px rgba(128, 0, 128, 0.1);
      border-radius: 12px;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.3s;
      text-align: center;
      width: 600px;
    }

    .login__box select.login__input {
      background-color: #111;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 10px;
      width: 100%;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      outline: none;
      cursor: pointer;
    }


    .login__box select.login__input option {
      background-color: #111;
      color: #fff;
    }



    .login__title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 10px rgba(186, 85, 211, 0.6);
      border-bottom: 2px solid rgb(186, 85, 211);
      display: inline-block;
      padding-bottom: 6px;
      margin-bottom: 5px;
    }

    .login__subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      color: #cfd5d9;
      letter-spacing: 1px;
      margin-top: 5px;
      margin-bottom: 1.5rem;
    }


    .login__inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .login__box {
      position: relative;
    }

    /* Estilos para campos autocompletados por RENIEC */
    .reniec-autocompleted {
      background-color: rgba(76, 175, 80, 0.15) !important;
      border-color: #4CAF50 !important;
      color: #000000 !important;
      font-weight: 600 !important;
    }

    /* Asegurar que el texto se vea negro en campos autocompletados */
    .login__input.reniec-autocompleted {
      color: #000000 !important;
    }

    .login__input.reniec-autocompleted::placeholder {
      color: rgba(0, 0, 0, 0.5) !important;
    }

    /* Estilo especial para el campo DNI (campo principal) */
    #dni {
      border: 2px solid rgba(186, 85, 211, 0.6);
      box-shadow: 0 0 10px rgba(186, 85, 211, 0.3);
    }

    #dni:focus {
      border-color: rgb(186, 85, 211);
      box-shadow: 0 0 15px rgba(186, 85, 211, 0.5);
    }


  </style>

</head>
<body>
<div class="login">
  <img th:src="@{/login/assets/img/login-bg.png}" alt="image" class="login__bg">

  <form method="post" th:action="@{/register}" class="login__form">
    <h1 class="login__title"><i class="ri-terminal-box-fill"></i> REGISTRO</h1>
    <h2 class="login__subtitle">Developer Portal</h2>

    <!-- Mensaje de error -->
    <div th:if="${error}" style="background-color: #dc3545; color: white; padding: 10px; margin: 10px 0; border-radius: 5px; font-size: 14px;">
      <i class="ri-alert-fill"></i> <span th:text="${error}"></span>
    </div>

    <div class="login__inputs">
      <!-- DNI va primero para autocompletado -->
      <div class="login__box" style="grid-column: 1 / -1;">
        <input type="text" id="dni" name="dni" placeholder="DNI (8 dígitos - presiona Tab para autocompletar)" required class="login__input" pattern="[0-9]{8}" maxlength="8" th:value="${param.dni}">
        <i class="ri-id-card-fill"></i>
      </div>
      
      <!-- Campos que se autocompletarán -->
      <div class="login__box">
        <input type="text" id="nombre" name="nombre" placeholder="Nombre" required class="login__input" th:value="${param.nombre}">
        <i class="ri-user-3-fill"></i>
      </div>
      <div class="login__box">
        <input type="text" id="apellidoPaterno" name="apellidoPaterno" placeholder="Apellido Paterno" required class="login__input" th:value="${param.apellidoPaterno}">
        <i class="ri-user-3-fill"></i>
      </div>
      <div class="login__box">
        <input type="text" id="apellidoMaterno" name="apellidoMaterno" placeholder="Apellido Materno" class="login__input" th:value="${param.apellidoMaterno}">
        <i class="ri-user-3-fill"></i>
      </div>
      <div class="login__box">
        <input type="email" name="correo" placeholder="Correo institucional" required class="login__input" th:value="${param.correo}">
        <i class="ri-mail-fill"></i>
      </div>

      <div class="login__box">
        <input type="password" name="contrasena" placeholder="Contraseña" required class="login__input" minlength="8">
        <i class="ri-lock-2-fill"></i>
      </div>
      <div class="login__box">
        <input type="password" name="confirmarContrasena" placeholder="Confirmar Contraseña" required class="login__input" minlength="8">
        <i class="ri-lock-2-fill"></i>
      </div>
    </div>

    <!-- Campo oculto para el rol (siempre será desarrollador) -->
    <input type="hidden" name="rol" value="desarrollador">

    <button type="submit" class="login__button">Registrarse</button>
    <a th:href="@{'/login'}" class="btn btn-secondary gap-2">
      <i class="ri-arrow-left-circle-fill"></i> Volver
    </a>
  </form>
</div>

<!-- Script de autocompletado RENIEC -->
<script th:src="@{/js/reniec-autocomplete.js}"></script>
<script>
  // Inicializar el autocompletado de RENIEC cuando el DOM esté listo
  document.addEventListener('DOMContentLoaded', function() {
    initReniecAutocomplete({
      dniInputId: 'dni',
      nombresInputId: 'nombre',
      apellidoPaternoInputId: 'apellidoPaterno',
      apellidoMaternoInputId: 'apellidoMaterno',
      autoTrigger: true,
      showNotifications: true
    });

    // Agregar instrucción visual para el usuario
    const dniInput = document.getElementById('dni');
    if (dniInput) {
      dniInput.addEventListener('focus', function() {
        this.placeholder = 'Ingresa 8 dígitos y presiona Tab o Enter';
      });
      
      dniInput.addEventListener('blur', function() {
        if (this.value.length === 0) {
          this.placeholder = 'DNI (8 dígitos - presiona Tab para autocompletar)';
        }
      });
    }
  });
</script>
</body>
</html>
