<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" crossorigin="">
   <link rel="stylesheet" th:href="@{/login/assets/css/styles.css}">
   <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
   <title>Ingreso - Telito</title>
   <style>

      @keyframes fadeInUp {
         0% {
            opacity: 0;
            transform: translateY(20px);
         }
         100% {
            opacity: 1;
            transform: translateY(0);
         }
      }


      .login__form {
         box-shadow: 0 0 20px rgba(0, 51, 102, 0.3),
         0 0 35px rgba(0, 51, 102, 0.1);

         text-align: center;
         border-radius: 12px;
         opacity: 0;
         animation: fadeInUp 1s ease forwards;
         animation-delay: 0.3s;
      }



      .login__title {
         font-family: 'Orbitron', sans-serif;
         font-size: 2.2rem;
         font-weight: 600;
         letter-spacing: 2px;
         text-transform: uppercase;
         color: #fff;
         text-shadow: 0 0 10px rgba(0, 51, 102, 0.3);
         border-bottom: 2px solid rgb(0, 0, 205);


         display: inline-block;
         padding-bottom: 6px;
         margin-bottom: 5px;
      }


      .login__subtitle {
         font-family: 'Orbitron', sans-serif;
         font-size: 1rem;
         font-weight: 300;
         color: #cfd5d9;
         letter-spacing: 1px;
         margin-top: 5px;
         margin-bottom: 1.5rem;
      }

      /* Estilos para OAuth2 */
      .login__separator {
         position: relative;
         text-align: center;
         margin: 1.5rem 0;
      }

      .login__separator::before {
         content: '';
         position: absolute;
         top: 50%;
         left: 0;
         right: 0;
         height: 1px;
         background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      }

      .login__separator-text {
         background: hsla(0, 0%, 100%, .01);
         padding: 0 1rem;
         color: #cfd5d9;
         font-size: 0.9rem;
         letter-spacing: 1px;
      }

      .login__oauth2-button {
         display: flex;
         align-items: center;
         justify-content: center;
         gap: 0.75rem;
         width: 100%;
         padding: 0.8rem 1rem;
         margin: 1rem 0;
         background: rgba(255, 255, 255, 0.95);
         color: #333;
         border: 2px solid rgba(255, 255, 255, 0.3);
         border-radius: 0.5rem;
         text-decoration: none;
         font-weight: 500;
         font-size: 0.95rem;
         letter-spacing: 0.5px;
         transition: all 0.3s ease;
         backdrop-filter: blur(10px);
      }

      .login__oauth2-button:hover {
         background: rgba(255, 255, 255, 1);
         border-color: rgba(66, 133, 244, 0.5);
         transform: translateY(-2px);
         box-shadow: 0 5px 15px rgba(66, 133, 244, 0.2);
      }

      .login__oauth2-icon {
         width: 20px;
         height: 20px;
         flex-shrink: 0;
      }
   </style>
</head>


<body>
<div class="login">
   <img th:src="@{/login/assets/img/login-bg.png}" alt="image" class="login__bg">

   <form th:action="@{/login}" method="POST" class="login__form">
   <h1 class="login__title"><i class="ri-terminal-box-fill"></i> Telito</h1>
      <h2 class="login__subtitle">Developer Portal</h2>

      <!-- Mensaje de error -->
      <div th:if="${error!=null && !error.isEmpty()}" class="login__error">
         <i class="ri-error-warning-fill"></i>
         <span th:text="${error}">Credenciales inválidas</span>
      </div>

      <!-- Mensaje de logout exitoso -->
      <div th:if="${logout!=null && !logout.isEmpty()}" class="login__success">
         <i class="ri-check-fill"></i>
         <span>Has cerrado sesión correctamente</span>
      </div>

      <!-- Mensaje de registro exitoso -->
      <div th:if="${success!=null && !success.isEmpty()}" class="login__success">
         <i class="ri-check-fill"></i>
         <span th:text="${success}">Mensaje de éxito</span>
      </div>

      <!-- Mensaje de advertencia -->
      <div th:if="${warning!=null && !warning.isEmpty()}" class="login__warning">
         <i class="ri-alert-fill"></i>
         <span th:text="${warning}">Mensaje de advertencia</span>
      </div>

      <div class="login__inputs">
         <div class="login__box">
            <input type="email" id="username" name="username" placeholder="Correo institucional" required class="login__input">
            <i class="ri-mail-fill"></i>
         </div>

         <div class="login__box">
            <input type="password" id="password" name="password" placeholder="Contraseña" required class="login__input">
            <i class="ri-lock-2-fill"></i>
         </div>
      </div>

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="login__check">
         <div class="login__check-box">
            <input type="checkbox" name="remember-me" class="login__check-input" id="user-check">
            <label for="user-check" class="login__check-label">Recuerdame</label>
         </div>

         <a th:href="@{/forgot-password}" class="login__forgot">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="login__button">
         Ingresar
      </button>

      <!-- Separador OAuth2 -->
      <div class="login__separator">
         <span class="login__separator-text">o</span>
      </div>

      <!-- Botón de OAuth2 Google -->
      <a th:href="@{/oauth2/authorization/google}" class="login__oauth2-button">
         <svg class="login__oauth2-icon" viewBox="0 0 24 24">
            <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
         </svg>
         Continuar con Google
      </a>



      <div class="login__register">
         No tienes una cuenta? <a th:href="@{/register}">Regístrate</a>
      </div>
   </form>
</div>
</body>
</html>
