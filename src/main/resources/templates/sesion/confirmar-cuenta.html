<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" crossorigin="">
   <link rel="stylesheet" th:href="@{/login/assets/css/styles.css}">
   <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
   <title>Confirmar Cuenta - Telito</title>
   <style>
      @keyframes fadeInUp {
         0% {
            opacity: 0;
            transform: translateY(20px);
         }
         100% {
            opacity: 1;
            transform: translateY(0);
         }
      }

      .login__form {
         box-shadow: 0 0 20px rgba(0, 51, 102, 0.3),
         0 0 35px rgba(0, 51, 102, 0.1);
         text-align: center;
         border-radius: 12px;
         opacity: 0;
         animation: fadeInUp 1s ease forwards;
         animation-delay: 0.3s;
      }

      .login__title {
         font-family: 'Orbitron', sans-serif;
         font-size: 2.2rem;
         font-weight: 600;
         letter-spacing: 2px;
         text-transform: uppercase;
         color: #fff;
         text-shadow: 0 0 10px rgba(0, 51, 102, 0.3);
         border-bottom: 2px solid rgb(0, 0, 205);
         display: inline-block;
         padding-bottom: 6px;
         margin-bottom: 5px;
      }

      .login__subtitle {
         font-family: 'Orbitron', sans-serif;
         font-size: 1rem;
         font-weight: 300;
         color: #cfd5d9;
         letter-spacing: 1px;
         margin-top: 5px;
         margin-bottom: 1.5rem;
      }

      .confirmation-info {
         background: rgba(66, 133, 244, 0.1);
         border: 1px solid rgba(66, 133, 244, 0.3);
         border-radius: 8px;
         padding: 1rem;
         margin: 1rem 0;
         color: #e3f2fd;
      }

      .confirmation-info h4 {
         color: #4285f4;
         margin-bottom: 0.5rem;
         font-size: 1.1rem;
      }

      .confirmation-info p {
         margin: 0.25rem 0;
         font-size: 0.9rem;
      }
   </style>
</head>

<body>
<div class="login">
   <img th:src="@{/login/assets/img/login-bg.png}" alt="image" class="login__bg">

   <form th:action="@{/confirmar-cuenta}" method="POST" class="login__form">
      <h1 class="login__title"><i class="ri-shield-check-fill"></i> Confirmar Cuenta</h1>
      <h2 class="login__subtitle">Telito Developer Portal</h2>

      <!-- Información del usuario si está disponible -->
      <div th:if="${tokenInfo}" class="confirmation-info">
         <h4><i class="ri-user-fill"></i> Información de Registro</h4>
         <p><strong>Email:</strong> <span th:text="${tokenInfo.email}"></span></p>
         <p><strong>Usuario:</strong> <span th:text="${tokenInfo.nombre}"></span></p>
         <p><strong>Código expira:</strong> <span th:text="${tokenInfo.fechaExpiracion}"></span></p>
      </div>

      <!-- Mensaje de error -->
      <div th:if="${error!=null && !error.isEmpty()}" class="login__error">
         <i class="ri-error-warning-fill"></i>
         <span th:text="${error}">Error de confirmación</span>
      </div>

      <!-- Mensaje de éxito -->
      <div th:if="${success!=null && !success.isEmpty()}" class="login__success">
         <i class="ri-check-fill"></i>
         <span th:text="${success}">Cuenta confirmada exitosamente</span>
      </div>

      <div class="login__inputs">
         <div class="login__box">
            <input type="email" id="email" name="email" th:value="${email}" 
                   placeholder="Email de registro" required class="login__input">
            <i class="ri-mail-fill"></i>
         </div>

         <div class="login__box">
            <input type="text" id="token" name="token" th:value="${token}" 
                   placeholder="Código de 6 dígitos" required class="login__input" 
                   maxlength="6" pattern="[0-9]{6}">
            <i class="ri-key-fill"></i>
         </div>

         <div class="login__box">
            <input type="password" id="password" name="password" 
                   placeholder="Nueva contraseña (min. 8 caracteres)" required class="login__input" 
                   minlength="8">
            <i class="ri-lock-2-fill"></i>
         </div>

         <div class="login__box">
            <input type="password" id="confirmPassword" name="confirmPassword" 
                   placeholder="Confirmar contraseña" required class="login__input" 
                   minlength="8">
            <i class="ri-lock-2-fill"></i>
         </div>
      </div>

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <button type="submit" class="login__button">
         <i class="ri-check-double-fill"></i> Confirmar y Activar Cuenta
      </button>

      <div class="login__register">
         <a th:href="@{/login}">← Volver al Login</a> | 
         <a th:href="@{/register}">¿No recibiste el código?</a>
      </div>
   </form>
</div>

<script>
// Validación de contraseñas en tiempo real
document.addEventListener('DOMContentLoaded', function() {
   const password = document.getElementById('password');
   const confirmPassword = document.getElementById('confirmPassword');
   
   function validatePasswords() {
      if (password.value && confirmPassword.value) {
         if (password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity('Las contraseñas no coinciden');
         } else {
            confirmPassword.setCustomValidity('');
         }
      }
   }
   
   password.addEventListener('input', validatePasswords);
   confirmPassword.addEventListener('input', validatePasswords);
   
   // Formatear código a solo números
   const tokenInput = document.getElementById('token');
   tokenInput.addEventListener('input', function(e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
   });
});
</script>

</body>
</html>
