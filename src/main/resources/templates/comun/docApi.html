<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>API JSON — Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root{
            --bg-primary:#0e1116;
            --bg-secondary:#111827;
            --bg-tertiary:#1f2937;
            --bg-code:#0b1320;
            --border-color:rgba(148,163,184,.12);
            --text-primary:#e5e7eb;
            --text-muted:#9ca3af;
            --accent-blue:#60a5fa;
            --accent-green:#34d399;
            --accent-purple:#a78bfa;
            --accent-yellow:#fbbf24;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            background:var(--bg-primary);
            color:var(--text-primary);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,Arial;
            line-height:1.5;
        }

        .header{
            padding:1.25rem;
            background:var(--bg-secondary);
            border-bottom:1px solid var(--border-color);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:1rem;
            flex-wrap:wrap;
        }
        .title{font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:.6rem}
        .badge{background:var(--bg-tertiary);color:var(--text-muted);padding:.25rem .6rem;border-radius:16px;font-size:.85rem}

        .header-actions{display:flex;gap:.5rem;align-items:center}
        .btn{
            padding:.5rem .9rem;border:1px solid var(--border-color);
            border-radius:6px;background:var(--bg-tertiary);
            color:var(--text-primary);cursor:pointer;font-size:.9rem;
            display:inline-flex;align-items:center;gap:.5rem;
        }
        .btn-primary{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff}
        .btn:hover{transform:translateY(-1px)}

        .wrap{max-width:1100px;margin:0 auto;padding:1.5rem}

        .controls{display:flex;gap:1rem;margin:1rem 0 1.5rem;flex-wrap:wrap;align-items:center}
        .view-toggle{display:flex;background:var(--bg-secondary);border-radius:6px;overflow:hidden}
        .view-toggle button{
            padding:.45rem .9rem;border:none;background:transparent;color:var(--text-muted);cursor:pointer;
        }
        .view-toggle button.active{background:var(--accent-blue);color:#fff}

        .search-box{position:relative;max-width:300px;flex:1}
        .search-input{width:100%;padding:.5rem .5rem .5rem 2.2rem;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:6px;color:var(--text-primary)}
        .search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem}

        .main-content{display:grid;grid-template-columns:240px 1fr;gap:1.5rem}
        @media (max-width:768px){.main-content{grid-template-columns:1fr}.sidebar{order:2}}

        .sidebar{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:10px;padding:1rem;position:sticky;top:1.25rem;height:fit-content}
        .sidebar h3{margin:0 0 0.5rem 0;font-size:1rem;color:var(--text-primary)}
        .json-outline{list-style:none;padding:0;margin:0}
        .json-outline li{padding:.25rem 0;border-bottom:1px solid var(--border-color)}
        .outline-item{color:var(--text-muted);text-decoration:none;padding:.25rem .4rem;display:block;border-radius:4px}
        .outline-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}

        .content-area{display:flex;flex-direction:column;gap:1rem}
        .section{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:10px;overflow:hidden}
        .section-header{padding:.85rem 1rem;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--bg-tertiary)}
        .section-title{font-weight:600;display:flex;align-items:center;gap:.5rem}

        .codebox{background:var(--bg-code)}
        .codecontent{max-height:560px;overflow:auto;padding:1rem;font-family:'SF Mono',Monaco,'Roboto Mono',Consolas,monospace;font-size:.9rem;line-height:1.6}
        .codecontent::-webkit-scrollbar{width:8px}
        .codecontent::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:4px}

        /* Syntax */
        .json .key{color:var(--accent-blue);font-weight:500}
        .json .string{color:var(--accent-green)}
        .json .number{color:var(--accent-purple);font-weight:500}
        .json .boolean{color:var(--accent-yellow);font-weight:600}
        .json .null{color:var(--text-muted);font-style:italic}
        .json .punctuation{color:var(--text-muted)}

        /* tree */
        .tree-node{margin-left:1rem}
        .tree-node-header{display:flex;align-items:center;gap:.5rem;padding:.25rem 0;cursor:pointer;border-radius:4px}
        .tree-toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text-muted)}
        .tree-key{color:var(--accent-blue);font-weight:500}
        .tree-children{border-left:1px solid var(--border-color);margin-left:.5rem;padding-left:1rem}
        .tree-children.collapsed{display:none}

        .highlight{background:var(--accent-yellow);color:black;padding:1px 2px;border-radius:2px}

        .loading{display:flex;align-items:center;gap:.5rem;color:var(--text-muted);padding:1rem}
        .error-state{padding:1rem;color:#f87171;text-align:center}

        /* accessibility */
        .btn:focus,.search-input:focus,.outline-item:focus{outline:2px solid var(--accent-blue);outline-offset:2px}
    </style>
</head>
<body>
<header class="header">
    <div style="display:flex;align-items:center;gap:.75rem">
        <div class="title">
            <i class="fas fa-code"></i>
            API JSON Viewer
        </div>
        <span class="badge">v2.0</span>
        <span class="badge" id="jsonType">JSON</span>
    </div>

    <div class="header-actions">
        <button id="copyBtn" class="btn btn-primary" title="Copiar JSON">
            <i class="fas fa-copy"></i> Copiar
        </button>
        <button id="formatBtn" class="btn" title="Formatear / Minimizar">
            <i class="fas fa-magic"></i> Formatear
        </button>
    </div>
</header>

<main class="wrap">
    <div class="controls">
        <div class="view-toggle" role="tablist" aria-label="Vistas JSON">
            <button class="active" data-view="json" role="tab" aria-selected="true"><i class="fas fa-code"></i> JSON</button>
            <button data-view="tree" role="tab" aria-selected="false"><i class="fas fa-sitemap"></i> Árbol</button>
            <!--      <button data-view="table" role="tab" aria-selected="false"><i class="fas fa-table"></i> Tabla</button>-->
        </div>

        <div class="search-box" style="max-width:400px">
            <i class="fas fa-search search-icon"></i>
            <input id="searchInput" class="search-input" placeholder="Buscar en JSON...">
        </div>
    </div>

    <div class="main-content">
        <aside class="sidebar">
            <h3><i class="fas fa-list"></i> Estructura</h3>
            <ul id="jsonOutline" class="json-outline">
                <li class="loading"><i class="fas fa-spinner"></i> Analizando...</li>
            </ul>
        </aside>

        <section class="content-area">
            <!-- JSON formateado -->
            <section class="section" id="jsonView">
                <div class="section-header">
                    <span class="section-title"><i class="fas fa-code"></i> JSON Formateado</span>
                    <div style="font-size:.9rem;color:var(--text-muted)">
                        <span id="lineCount">-</span> líneas · <span id="charCount">-</span> caracteres
                    </div>
                </div>
                <div class="codebox">
                    <div class="codecontent">
                        <pre class="json"><code id="jsonOut" aria-live="polite"></code></pre>
                    </div>
                </div>
            </section>

            <!-- Vista árbol -->
            <section class="section" id="treeView" style="display:none">
                <div class="section-header">
                    <span class="section-title"><i class="fas fa-sitemap"></i> Vista de Árbol</span>
                    <button id="expandAllBtn" class="btn"><i class="fas fa-expand-arrows-alt"></i> Expandir todo</button>
                </div>
                <div class="codebox">
                    <div id="treeContent" class="codecontent">
                        <div class="loading"><i class="fas fa-spinner"></i> Generando vista de árbol...</div>
                    </div>
                </div>
            </section>
        </section>
    </div>
</main>

<!-- Inyectamos el JSON crudo en un script type application/json para que JS lo lea con seguridad.
     Si doc.contenido ya es JSON text/plain, th:utext imprimirá el JSON sin escapes.
     Asegúrate de que `doc.contenido` sea texto JSON válido en el modelo. -->
<script id="jsonData" type="application/json" th:utext="${doc.contenido}"></script>

<script>
    // Elementos
    const jsonOut = document.getElementById('jsonOut');
    const jsonDataEl = document.getElementById('jsonData');
    const copyBtn = document.getElementById('copyBtn');
    const formatBtn = document.getElementById('formatBtn');
    const searchInput = document.getElementById('searchInput');
    const jsonOutline = document.getElementById('jsonOutline');
    const lineCountEl = document.getElementById('lineCount');
    const charCountEl = document.getElementById('charCount');
    const treeView = document.getElementById('treeView');
    const treeContent = document.getElementById('treeContent');
    const jsonView = document.getElementById('jsonView');
    const tableView = document.getElementById('tableView');
    const tableContent = document.getElementById('tableContent');
    const expandAllBtn = document.getElementById('expandAllBtn');
    const viewButtons = document.querySelectorAll('.view-toggle button');

    // Parse JSON safely from the script tag
    let parsed = null;
    try {
        parsed = JSON.parse(jsonDataEl.textContent || '{}');
    } catch (e) {
        jsonOut.textContent = 'JSON inválido: ' + e.message;
        jsonOut.classList.add('error-state');
        console.error(e);
    }

    // Helpers de render
    function syntaxHighlight(value) {
        if (value === null) return '<span class="null">null</span>';
        if (typeof value === 'string') return '<span class="string">"' + escapeHtml(value) + '"</span>';
        if (typeof value === 'number') return '<span class="number">' + value + '</span>';
        if (typeof value === 'boolean') return '<span class="boolean">' + value + '</span>';
        return value;
    }
    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // Render JSON formateado (pretty)
    function renderJson(obj){
        try {
            const pretty = JSON.stringify(obj, null, 2);
            jsonOut.innerHTML = pretty
                .replace(/(^|\n)(\s*)("[^"\n]+")(?=\s*:)/g, (m,p,sp,k)=> p + sp + '<span class="key">'+k+'</span>')
                .replace(/"([^"]*)"(?=\s*[,\n])/g, (m,s)=> '<span class="string">"' + escapeHtml(s) + '"</span>')
                .replace(/\b(true|false)\b/g, m => '<span class="boolean">'+m+'</span>')
                .replace(/\b(null)\b/g, m => '<span class="null">'+m+'</span>')
                .replace(/(-?\d+\.?\d*(?:[eE][+\-]?\d+)?)/g, m => '<span class="number">'+m+'</span>');
            const lines = pretty.split('\n').length;
            lineCountEl.textContent = lines;
            charCountEl.textContent = pretty.length;
        } catch(e){
            jsonOut.textContent = 'Error al renderizar JSON';
            console.error(e);
        }
    }

    // Build outline (top-level keys)
    function buildOutline(obj){
        jsonOutline.innerHTML = '';
        if (obj && typeof obj === 'object'){
            const keys = Array.isArray(obj) ? obj.map((v,i)=>i) : Object.keys(obj);
            if (keys.length === 0){
                const li = document.createElement('li'); li.textContent = '(vacío)'; jsonOutline.appendChild(li);
                return;
            }
            keys.forEach(k=>{
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'outline-item';
                a.textContent = k;
                a.onclick = (ev)=>{
                    ev.preventDefault();
                    // buscar clave en la representación formateada y scrollear
                    const txt = document.querySelector('#jsonOut').innerText;
                    const idx = txt.indexOf(String(k));
                    if (idx>=0){
                        // busco la línea aproximada
                        const upTo = txt.slice(0, idx);
                        const line = upTo.split('\n').length;
                        // scroll to approximate position
                        const pre = document.querySelector('#jsonOut');
                        const lineHeight = 18;
                        pre.parentElement.scrollTop = Math.max(0, (line-6)*lineHeight);
                    }
                };
                li.appendChild(a);
                jsonOutline.appendChild(li);
            });
        } else {
            const li = document.createElement('li'); li.textContent = '(no es objeto)'; jsonOutline.appendChild(li);
        }
    }

    // Build simple tree view
    function makeTree(node){
        if (node === null || typeof node !== 'object'){
            const span = document.createElement('div');
            span.className = 'tree-node-header';
            span.innerHTML = '<span class="tree-key">'+ syntaxHighlight(node) +'</span>';
            return span;
        }
        const container = document.createElement('div');
        const entries = Array.isArray(node) ? node.map((v,i)=>[i,v]) : Object.entries(node);
        entries.forEach(([k,v])=>{
            const wrapper = document.createElement('div');
            wrapper.className = 'tree-node';
            const header = document.createElement('div');
            header.className = 'tree-node-header';
            const toggle = document.createElement('div');
            toggle.className = 'tree-toggle';
            toggle.textContent = (v && typeof v === 'object') ? '+' : '';
            const key = document.createElement('div');
            key.className = 'tree-key';
            key.textContent = k;
            const type = document.createElement('div');
            type.className = 'tree-type';
            type.style.marginLeft='auto';
            type.style.color='var(--text-muted)';
            type.textContent = Array.isArray(v) ? 'array' : (v===null ? 'null' : typeof v);
            header.appendChild(toggle);
            header.appendChild(key);
            header.appendChild(type);
            wrapper.appendChild(header);
            if (v && typeof v === 'object'){
                const children = document.createElement('div');
                children.className = 'tree-children collapsed';
                children.appendChild( makeTree(v) );
                wrapper.appendChild(children);
                header.addEventListener('click', ()=> {
                    const collapsed = children.classList.contains('collapsed');
                    children.classList.toggle('collapsed', !collapsed);
                    toggle.textContent = collapsed ? '−' : '+';
                });
            } else {
                const leaf = document.createElement('div');
                leaf.style.paddingLeft='1.1rem';
                leaf.innerHTML = syntaxHighlight(v);
                wrapper.appendChild(leaf);
            }
            container.appendChild(wrapper);
        });
        return container;
    }

    /* ]]> */

    // Initialize UI
    if (parsed !== null){
        renderJson(parsed);
        buildOutline(parsed);
        // build tree lazily
        treeContent.innerHTML = ''; treeContent.appendChild( makeTree(parsed) );
    }

    // Copy functionality
    copyBtn.addEventListener('click', async () => {
        try{
            const pretty = JSON.stringify(parsed, null, 2);
            await navigator.clipboard.writeText(pretty);
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copiado';
            setTimeout(()=> copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copiar', 1600);
        } catch(e){
            console.error(e);
            alert('No se pudo copiar al portapapeles.');
        }
    });

    // Format/minify toggle
    let prettyMode = true;
    formatBtn.addEventListener('click', ()=>{
        if (!parsed) return;
        if (prettyMode){
            jsonOut.textContent = JSON.stringify(parsed);
            formatBtn.innerHTML = '<i class="fas fa-magic"></i> Formatear';
            prettyMode = false;
        } else {
            renderJson(parsed);
            formatBtn.innerHTML = '<i class="fas fa-magic"></i> Minimizar';
            prettyMode = true;
        }
    });

    // Search: highlights simple matches in the JSON view (text-based)
    searchInput.addEventListener('input', ()=> {
        const q = searchInput.value.trim();
        if (!q){
            // re-render original
            if (prettyMode) renderJson(parsed);
            else jsonOut.textContent = JSON.stringify(parsed);
            return;
        }
        const regex = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
        const pretty = JSON.stringify(parsed, null, 2).replace(regex, (m)=>`@@@HIGHLIGHT@@@${m}@@@END@@@`);
        // escape and replace tokens
        const escaped = escapeHtml(pretty)
            .replace(/@@@HIGHLIGHT@@@/g,'<span class="highlight">')
            .replace(/@@@END@@@/g,'</span>');
        // also colorize keys/numbers/booleans minimally
        const colored = escaped
            .replace(/(^|\n)(\s*)(&quot;[^&quot;\n]+&quot;)(?=\s*:)/g, (m,p,sp,k)=> p + sp + '<span class="key">'+k+'</span>')
            .replace(/(&quot;([^&quot;]*)&quot;)(?=\s*[,\n])/g, (m)=> '<span class="string">'+m+'</span>')
            .replace(/\b(true|false)\b/g, m=>'<span class="boolean">'+m+'</span>')
            .replace(/\b(null)\b/g, m=>'<span class="null">'+m+'</span>')
            .replace(/(-?\d+\.?\d*(?:[eE][+\-]?\d+)?)/g, m=>'<span class="number">'+m+'</span>');
        jsonOut.innerHTML = colored;
    });

    // View toggles
    viewButtons.forEach(btn=>{
        btn.addEventListener('click', ()=>{
            viewButtons.forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            const v = btn.getAttribute('data-view');
            jsonView.style.display = v === 'json' ? '' : 'none';
            treeView.style.display = v === 'tree' ? '' : 'none';
            viewButtons.forEach(b=> b.setAttribute('aria-selected', b === btn ? 'true' : 'false'));
        });
    });

    // Expand all/Collapse all
    expandAllBtn.addEventListener('click', ()=>{
        const children = treeContent.querySelectorAll('.tree-children');
        const anyCollapsed = Array.from(children).some(c=>c.classList.contains('collapsed'));
        children.forEach(c=> c.classList.toggle('collapsed', !anyCollapsed));
        // update toggles
        treeContent.querySelectorAll('.tree-toggle').forEach(t=> t.textContent = anyCollapsed ? '−' : '+');
    });

</script>
</body>
</html>
