<!-- documentacion/fragments/header.html -->
<div th:fragment="doc-header" xmlns:th="http://www.thymeleaf.org">
    <!-- Breadcrumb -->
    <div class="page-header d-print-none mb-3">
        <div class="row g-2 align-items-center">
            <div class="col">
                <h2 class="page-title">
                    <i class="fas fa-book me-2"></i>
                    <span th:text="${doc.api.nombre}">Documentación API</span>
                </h2>
            </div>
            <div class="col-auto ms-auto d-print-none">
                <div class="btn-list">
                    <a th:href="@{/apis}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i>
                        Volver
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Metadata Card -->
    <div class="row mb-3">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 flex-fill">
                            <div class="text-muted mb-1">Versión</div>
                            <div class="fw-bold" th:text="${doc.versionApi.version}">1.0.0</div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-muted mb-1">URL Base</div>
                            <div class="fw-bold text-truncate" th:text="${doc.api.endpointUrl}">https://api.example.com</div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-muted mb-1">Estado</div>
                            <div>
                                <span class="badge" th:text="${doc.versionApi.estadoVersion}">Activa</span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-muted mb-1">Fecha creación</div>
                            <div class="fw-bold" th:text="${#dates.format(doc.fechaCreacion, 'dd/MM/yyyy')}">30/09/2025</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="row mb-3">
        <div class="col-12">
            <ul class="nav nav-tabs" role="list">
<!--                <li class="nav-item">-->
<!--                    <a class="nav-link" th:href="@{'/documentacion/' + ${doc.idDocumentacion}}"-->
<!--                       th:classappend="${currentView == 'info'} ? 'active' : ''">-->
<!--                        <i class="fas fa-info-circle me-2"></i>-->
<!--                        Información-->
<!--                    </a>-->
<!--                </li>-->
                <li class="nav-item" th:classappend="${currentView == 'docs'} ? 'active' : ''">
                    <a class="nav-link" th:href="@{'/documentacion/' + ${doc.idDocumentacion}}">
                        <i class="fas fa-book me-2"></i>
                        Documentación
                    </a>
                </li>
                <li class="nav-item" th:classappend="${currentView == 'playground'} ? 'active' : ''">
                    <a class="nav-link" th:href="@{'/documentacion/' + ${doc.idDocumentacion} + '/playground'}">
                        <i class="fas fa-play-circle me-2"></i>
                        Playground
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
