<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Docs - Telito</title>
  <!-- Tabler CSS -->
  <link href="/tabler/dist/css/tabler.css" rel="stylesheet"/>
  <link href="/tabler/dist/css/tabler-flags.css" rel="stylesheet"/>
  <link href="/tabler/dist/css/tabler-socials.css" rel="stylesheet"/>
  <link href="/tabler/dist/css/tabler-payments.css" rel="stylesheet"/>
  <link href="/tabler/dist/css/tabler-vendors.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<script src="/tabler/dist/js/tabler-theme.min.js"></script>

<div class="page">
  <header th:replace="desarrollador/header :: header" sec:authorize="hasRole('DEV')"></header>
  <header th:replace="admin/header :: header" sec:authorize="hasRole('SUPERADMIN')"></header>
  <header th:replace="po/header_po :: header" sec:authorize="hasRole('PO')"></header>
  <header th:replace="qa/header_qa :: header" sec:authorize="hasRole('QA')"></header>


  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
        <!-- Header de navegación -->
        <div class="row mb-4">
          <div class="col">
            <div class="page-pretitle">Documentación</div>
            <h1 class="page-title" th:text="${api.nombre}">API 1</h1>
          </div>
          <!-- Acción para QA -->
          <div sec:authorize="hasRole('QA')" class="col-md-auto">
            <a class="btn btn-primary" th:href="@{/qa/crearFeedback/{apiId}(apiId=${api.idApi})}">
              <i class="fas fa-comment-dots me-2"></i>Generar Feedback
            </a>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-3 col-md-4 mb-4 mb-md-0">
            <!--                    <div th:replace="fragments/docs/sidebar :: docs-sidebar(${doc.id}, 'info')"></div>-->
            <div th:replace="general/docs/docSidebar :: docs-sidebar(${api.idApi}, ${currentView}, ${nombresSecs})"></div>

            <!-- Información rápida -->
            <div class="card mt-3">
              <div class="card-header">
                <h4 class="card-title">Detalles Rápidos</h4>
              </div>
              <div class="card-body">
                <div class="mb-2">
                  <strong>Base URL:</strong>
                  <code th:text="${api.endpointUrl}">https://api.telito.com/v1</code>
                </div>
                <!--                                <div class="mb-2">-->
                <!--                                    <strong>Formato:</strong>-->
                <!--                                    <span class="badge bg-blue text-blue-fg">JSON</span>-->
                <!--                                </div>-->
                <!--                                <div class="mb-2">-->
                <!--                                    <strong>Autenticación:</strong>-->
                <!--                                    <span class="badge bg-orange text-orange-fg" >JWT</span>-->
                <!--                                </div>-->
                <div>
                  <strong>Estado:</strong>
                  <span class="badge" th:classappend="' bg-'+${api.estadoApi.estado.toLowerCase()}"
                        th:text="${api.estadoApi.estado}">TESTING</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Contenido principal -->
          <div class="col-lg-9 col-md-6">
            <div class="card ms-3" style="min-height: auto">
              <div class="card-header">
                <div class="row align-items-center">
                  <div class="col">
                    <h2 class="card-title" th:text="${currentView}">Información General</h2>
                  </div>
                </div>
              </div>
              <div class="card-body" id="doc-content">
                <!-- Aquí se renderiza dinámicamente -->

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Tabler JS -->
<script src="/tabler/dist/js/tabler.min.js"></script>

<script>
  // Simulación de JSON hardcodeado (resultado de procesar un .md)
  const docData = {
    "info": "<h2>API 1</h2><ul><li><strong>Dominio/API:</strong> Clientes/REST</li><li><strong>Versión:</strong> 2.1</li><li><strong>Estado:</strong> TESTING</li><li><strong>Fecha de publicación:</strong> 12/09/2006</li></ul><p>Esta API proporciona funcionalidades completas para la gestión de clientes...</p>",
    "doc": "<h3>Documentación</h3><p>La API soporta comunicación segura vía HTTPS, con autenticación basada en tokens...</p>",
    "examples": "<h3>Ejemplos</h3><pre><code>GET /api/clientes/123\n{\n  \"id\": 123,\n  \"nombre\": \"Juan Pérez\",\n  \"estado\": \"activo\"\n}</code></pre>",
    "contract": "<h3>Contrato</h3><p>Aquí se mostraría el contrato OpenAPI/Swagger o un esquema JSON.</p>"
  };

  const path = window.location.pathname;
  const parts = path.split("/");

  const idApi = parts[2];
  const section = parts[3];

  const contentDiv = document.getElementById("doc-content");
  // Render inicial
  fetch(`/documentacion/${idApi}/${section}/.html`)
          .then(r => r.text())
          .then(html => {
    contentDiv.innerHTML = html;
  });
</script>
</body>
</html>
