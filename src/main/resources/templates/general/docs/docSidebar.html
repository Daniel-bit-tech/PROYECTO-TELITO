<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

                        </a>
                    </li>
                    <li class="nav-item">

<!--                            <span th:text="${seccion}">Sección</span>-->
<!--                        </a>-->
<!--                    </li>-->

                           th:attr="data-seccion=${seccion}">

                            <span th:text="${seccion}">Sección</span>

                </div>
            </div>

</html>
