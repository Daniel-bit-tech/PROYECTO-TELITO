<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fragmento del sidebar -->
<div th:fragment="docs-sidebar(idApi, currentView, nombresSec)">
    <div class="card">
        <div class="card-body">
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a th:class="${currentView == 'info' ? 'nav-link active' : 'nav-link'}"
                       th:href="@{/apis/{idApi}/docs (idApi=${idApi})}">
                        <i class="fas fa-info-circle me-2"></i>
                        Información General
                    </a>
                </li>
                <li class="nav-item">
                    <a th:class="${currentView == 'contrato' ? 'nav-link active' : 'nav-link'}"
                       th:href="@{/documentacion/{idApi}/contrato (idApi=${idApi})}">
<!--                       th:href="@{/documentacion/{idApi}/contrato/{idContrato} (idApi=${idApi},idContrato=${idContrato})}">-->
                        <i class="fas fa-book-bookmark me-2"></i>
                        Contratos
                    </a>
                </li>

                <li th:each="seccion : ${nombresSec}" class="nav-item">
                    <a th:class="${currentView == seccion ? 'nav-link active' : 'nav-link'}"
                       th:href="@{/documentacion/{idApi}/{nomSec}(idApi=${idApi}, nomSec=${seccion})}">
                        <i class="fas fa-list me-2"></i>
                        <span th:text="${seccion}">Sección</span>
                    </a>
                </li>


            </ul>
        </div>
    </div>

</div>
</body>
</html>
