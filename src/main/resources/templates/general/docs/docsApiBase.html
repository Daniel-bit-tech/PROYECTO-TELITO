<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title>Documentación API - Telito</title>
    <title>API 1 - Información</title>
    <link href="/tabler/dist/libs/jsvectormap/dist/jsvectormap.css?1757307620" rel="stylesheet" />
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="/tabler/dist/css/tabler.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-flags.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-socials.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-payments.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-vendors.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-marketing.css?1757307620" rel="stylesheet" />
    <link href="/tabler/dist/css/tabler-themes.css?1757307620" rel="stylesheet" />
    <link href="/tabler/preview/css/demo.css?1757307620" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/tabler/dist/js/tabler-theme.min.js"></script>
    <style>
        .bg-activo{
            background-color: rgba(var(--tblr-success-rgb), 0.1);
            color: var(--tblr-success);
        }
        .bg-deprecado{
            background-color: rgba(var(--tblr-warning-rgb), 0.1);
            color: var(--tblr-warning);
        }
        .bg-inactivo{
            background-color: rgba(var(--tblr-danger-rgb), 0.1);
            color: var(--tblr-danger);
        }
    </style>
</head>
<body>
<script src="/tabler/dist/js/tabler-theme.min.js"></script>

<div th:replace="~{components/impersonation-banner :: impersonation-banner}"></div>

<div class="page">
    <header th:replace="desarrollador/header :: header" sec:authorize="hasRole('DEV')"></header>
    <header th:replace="admin/header :: header" sec:authorize="hasRole('SUPERADMIN')"></header>
    <header th:replace="po/header_po :: header" sec:authorize="hasRole('PO')"></header>
    <header th:replace="qa/header_qa :: header" sec:authorize="hasRole('QA')"></header>

    <div class="page-wrapper">
        <div class="page-body">
            <div class="container-xl">
                <!-- Header de navegación -->
                <div class="row mb-4">
                    <div class="col">
                        <div class="page-pretitle">Documentación</div>
                        <h1 class="page-title" th:text="${api.nombre}">API 1</h1>
                    </div>
                    <!-- Acción para QA -->
                    <div sec:authorize="hasRole('QA')" class="col-md-auto">
                        <a class="btn btn-primary" th:href="@{/qa/crearFeedback/{apiId}(apiId=${api.idApi})}">
                            <i class="fas fa-comment-dots me-2"></i>Generar Feedback
                        </a>
                    </div>

                </div>

                <div class="row">

                    <div th:replace="general/docs/docSidebar :: docs-sidebar(${api.idApi}, 'info', ${nombresSecs})"></div>

                    <!-- Contenido principal -->
                    <div class="col-lg-9 col-md-7">
                        <div id="doc-content" style="min-height: auto">
                        <!-- Aquí se renderiza dinámicamente -->

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{desarrollador/footer :: footer}" sec:authorize="hasRole('DEV')"></div>

<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055"></div>

<script src="/tabler/dist/js/tabler.min.js"></script>

<script th:inline="javascript">

    // Función para mostrar toast
    function showToast(message, type) {
        // Crear contenedor de toast si no existe
        let toastContainer = document.getElementById('toast-container');
        if (!toastContainer) {
            toastContainer = document.createElement('div');
            toastContainer.id = 'toast-container';
            toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
            document.body.appendChild(toastContainer);
        }

        const toast = document.createElement('div');
        toast.className = `toast show align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0`;
        toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">
          <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle me-2"></i>${message}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    `;
        toastContainer.appendChild(toast);

        // Auto-remover después de 5 segundos
        setTimeout(() => {
            toast.remove();
        }, 5000);
    }

    $(document).ready(function() {
        const idApi = [[${api.idApi}]];

        // Manejar clics en secciones
        $('.seccion-link').on('click', function(e) {
            e.preventDefault();

            const $this = $(this);
            const seccion = $this.data('seccion');

            if ($this.hasClass('active')) return;

            $('.seccion-link').removeClass('active');
            $this.addClass('active');

            cargarContenidoSeccionConAnimacion(idApi, seccion);
        });

        $(document).on("click", ".btn-download-doc", function () {
            const docId = $(this).data("doc-id");
            const docName = $(this).data("doc-name") || "documento";

            $.ajax({
                url: `/documentacion/${docId}/download`,
                type: "GET",
                success: function (data) {
                    if (data.success && data.url) {
                        // Descargar directamente desde S3
                        const a = document.createElement("a");
                        a.href = data.url;
                        a.download = docName;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } else {
                        showToast(data.message || "No se pudo descargar el archivo", "danger");
                    }
                },
                error: function (xhr) {
                    let msg = "Error al descargar el archivo";
                    if (xhr.responseJSON?.message) msg = xhr.responseJSON.message;
                    showToast(msg, "danger");
                }
            });
        });

        cargarContenidoSeccionConAnimacion(idApi, 'info');
    });

    function cargarContenidoSeccionConAnimacion(idApi, seccion) {
        const $contenedor = $('#doc-content');
        // Animación de fade out
        $contenedor.fadeOut(300, function() {
            // Mostrar loading
            $contenedor.html(`
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-2">Cargando ${seccion}...</p>
                </div>
            `).fadeIn(300);

            // Hacer petición AJAX
            $.ajax({
                url: '/documentacion/'+idApi+'/'+encodeURIComponent(seccion)+'/.html',
                type: 'GET',
                success: function(html) {
                    $contenedor.fadeOut(300, function() {
                        $contenedor.html(html).fadeIn(300);

                    });
                },
                error: function(xhr, status, error) {
                    $contenedor.html(`
                        <div class="alert alert-danger">
                            <h5>Error al cargar la sección</h5>
                            <p>No se pudo cargar el contenido de "${seccion}".</p>
                            <small>Error: ${error}</small>
                        </div>
                    `).fadeIn(300);
                }
            });
        });
    }
</script>

</body>
</html>
