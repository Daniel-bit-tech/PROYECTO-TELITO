# ============================================
# CONFIGURACIÓN PARA PRODUCCIÓN (VM)
# ============================================
# Para usar este perfil, ejecuta con:
# java -jar -Dspring.profiles.active=production TELITODEV-0.0.1-SNAPSHOT.jar
# ============================================

# =========================================================
# BASE DE DATOS - PRODUCCIÓN
# =========================================================
# IMPORTANTE: Cambia estos valores por los de tu VM
spring.datasource.url=jdbc:mysql://localhost:3306/db_telito
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones optimizado para producción
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JPA/HIBERNATE - PRODUCCIÓN
# =========================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# SERVIDOR - PRODUCCIÓN
# =========================================================
# Puerto estándar de producción
server.port=8080

# URL pública de tu VM (cambia por tu IP o dominio)
app.url=http://localhost:8080

# =========================================================
# THYMELEAF - PRODUCCIÓN (con caché habilitado)
# =========================================================
spring.thymeleaf.cache=true

# =========================================================
# EMAIL - PRODUCCIÓN
# =========================================================
spring.mail.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# =========================================================
# COOKIES Y SESIONES - PRODUCCIÓN
# =========================================================
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=7200
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=120m

spring.session.store-type=none

# =========================================================
# OAUTH2 - PRODUCCIÓN
# =========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET}
# IMPORTANTE: Cambia esta URL por la de tu VM
spring.security.oauth2.client.registration.google.redirect-uri=http://TU_IP_VM:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

oauth2.success-url=/dashboard
oauth2.failure-url=/login?error=oauth2

# =========================================================
# AWS S3 - PRODUCCIÓN
# =========================================================
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# =========================================================
# CHATBOT - PRODUCCIÓN
# =========================================================
# El chatbot funciona localmente en la misma aplicación
chatbot.aws.url=http://localhost:8080/dev/soporte/chat

# =========================================================
# LOGGING - PRODUCCIÓN (menos verbose)
# =========================================================
logging.level.root=INFO
logging.level.com.example.telitodev=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Archivo de logs
logging.file.name=/var/log/telitodev/application.log
logging.file.max-size=10MB
logging.file.max-history=30
