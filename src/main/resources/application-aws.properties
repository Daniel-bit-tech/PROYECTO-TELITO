# Configuración específica para AWS Elastic Beanstalk
# Este perfil desactiva funcionalidades que requieren configuración adicional

# Puerto para Elastic Beanstalk
server.port=${SERVER_PORT:5000}

# Desactivar OAuth2 temporalmente
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Desactivar email temporalmente
spring.mail.enabled=false

# Base de datos (usar las variables de AWS)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# Logging simplificado
logging.level.root=INFO
logging.level.com.example.telitodev=DEBUG

# URL del chatbot (sí mismo)
chatbot.aws.url=http://localhost:5000/chat
