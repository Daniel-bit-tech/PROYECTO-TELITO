# =========================================================
# CONFIGURACIÓN OAUTH2 - GOOGLE
# =========================================================

# Configuración del cliente OAuth2 para Google
# IMPORTANTE: Debes obtener estas credenciales de Google Cloud Console
# OAuth2 Google Configuration
# Configura estas variables de entorno antes de ejecutar la aplicación:
# GOOGLE_OAUTH2_CLIENT_ID=tu-client-id-aqui
# GOOGLE_OAUTH2_CLIENT_SECRET=tu-client-secret-aqui
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth2 Provider Configuration para mayor estabilidad
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# URLs de OAuth2 personalizadas
oauth2.success-url=/dashboard
oauth2.failure-url=/login?error=oauth2

# Logging para debugging OAuth2 - MÁXIMO DETALLE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.web.authentication=TRACE
logging.level.org.springframework.security.oauth2.client=TRACE
logging.level.org.springframework.security.oauth2.core=TRACE
logging.level.com.example.telitodev.service.OAuth2UserService=DEBUG
logging.level.org.springframework.web.client=TRACE
logging.level.org.springframework.security.oauth2.client.web=TRACE
logging.level.org.springframework.security.oauth2.client.endpoint=TRACE
logging.level.org.springframework.security.oauth2.client.registration=TRACE
logging.level.org.springframework.security.web.server.authorization=TRACE
logging.level.org.apache.http=DEBUG
logging.level.org.apache.http.wire=DEBUG

