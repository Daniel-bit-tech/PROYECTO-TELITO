 # Configuraci�n de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_telito
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci�n de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true

# Configuraci�n de codificaci�n
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# Configuraci�n del servidor
server.port=8080

# Configuraci�n de Thymeleaf
spring.thymeleaf.cache=false

# Configuración de Email (Gmail SMTP)
# Configuraci�n de Email (habilitado)
spring.mail.enabled=true
# Para habilitar email real, cambiar a true y configurar credenciales:
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=telitodevportal@gmail.com
spring.mail.password=dqppurwycuclkclh
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Configuraciones adicionales para evitar problemas SSL en desarrollo
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false

# Configuraci�n JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Configuraciones para evitar problemas de validación estricta
spring.jpa.defer-datasource-initialization=true
# Estrategia de nombrado: mantiene los nombres tal como están definidos en las entidades
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Configuraciones adicionales para manejo de esquema existente
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Configuraci�n de la aplicaci�n
app.name=TelitoDev
app.url=http://localhost:8080

# =========================================================
# CONFIGURACIÓN DE SPRING SESSION Y SEGURIDAD AVANZADA
# =========================================================

# Spring Session - Almacenamiento en base de datos
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=3600s
spring.session.servlet.filter-order=-2147483598

# Configuraciones específicas para MySQL y Spring Session
spring.session.jdbc.cleanup-cron=0 */5 * * * *
spring.datasource.hikari.auto-commit=true

# Configuración de cookies de sesión
server.servlet.session.cookie.name=TELITODEV-SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=3600
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=strict

# Control de sesiones concurrentes
spring.security.session.maximum-sessions=2
spring.security.session.max-sessions-prevents-login=false

# Configuración de timeout y limpieza
server.servlet.session.timeout=60m
spring.session.cleanup-cron=0 */5 * * * *
# Debug de Spring Web
logging.level.org.springframework.web=DEBUG

# Debug de Jackson
logging.level.com.fasterxml.jackson.databind=DEBUG

