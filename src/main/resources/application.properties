    # Configuraci n de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_telito
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci n del Cliente S3
spring.cloud.aws.region.static=us-west-2
spring.cloud.aws.credentials.access-key=${S3_BUCKET_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${S3_BUCKET_SECRET_KEY}

# Configuraci n de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true

# Configuraci n de codificaci n
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# Configuraci n del servidor
server.port=8080

# Configuraci n de Thymeleaf
spring.thymeleaf.cache=false

# Configuraci de Email (Gmail SMTP)
# Configuraci n de Email (deshabilitado temporalmente)
spring.mail.enabled=false
# Para habilitar email real, cambiar a true y configurar credenciales:
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@telitodev.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Configuraciones adicionales para evitar problemas SSL en desarrollo
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false

# Configuraciones adicionales para manejo de esquema existente
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Configuraci n de la aplicaci n
app.name=TelitoDev
app.url=http://34.212.200.2:8080

# =========================================================
# CONFIGURACIÓN DE SPRING SESSION Y SEGURIDAD AVANZADA
# =========================================================

# Spring Session - HABILITADO para persistencia de sesiones
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=604800s
spring.session.servlet.filter-order=-2147483598

# Configuraciones especficas para MySQL y Spring Session
spring.session.jdbc.cleanup-cron=0 */5 * * * *
spring.datasource.hikari.auto-commit=true

# Configuracin de cookies de sesin - SIMPLIFICADA PARA OAUTH2
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=7200
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax

# Control de sesiones concurrentes
spring.security.session.maximum-sessions=5
spring.security.session.max-sessions-prevents-login=false

# Configuracin de timeout y limpieza - AUMENTADO PARA OAUTH2
server.servlet.session.timeout=10080m

# Redis como almacn alternativo (opcional - comentado por defecto)
# spring.session.store-type=redis
# spring.redis.host=localhost
# spring.redis.port=6379
# spring.redis.password=
# spring.redis.timeout=60000ms

# =========================================================
# CONFIGURACIN OAUTH2 - GOOGLE
# =========================================================

# Configuracin del cliente OAuth2 para Google
# IMPORTANTE: Debes obtener estas credenciales de Google Cloud Console
# OAuth2 Google Configuration
# Configura estas variables de entorno antes de ejecutar la aplicacn:
# GOOGLE_OAUTH2_CLIENT_ID=tu-client-id-aqui
# GOOGLE_OAUTH2_CLIENT_SECRET=tu-client-secret-aqui
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth2 Provider Configuration para mayor estabilidad
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub


# URLs de OAuth2 personalizadas
oauth2.success-url=/dashboard
oauth2.failure-url=/login?error=oauth2

# Logging para debugging OAuth2 - MXIMO DETALLE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.web.authentication=TRACE
logging.level.org.springframework.security.oauth2.client=TRACE
logging.level.org.springframework.security.oauth2.core=TRACE
logging.level.com.example.telitodev.service.OAuth2UserService=DEBUG
logging.level.org.springframework.web.client=TRACE
logging.level.org.springframework.security.oauth2.client.web=TRACE
logging.level.org.springframework.security.oauth2.client.endpoint=TRACE
logging.level.org.springframework.security.oauth2.client.registration=TRACE
logging.level.org.springframework.security.web.server.authorization=TRACE
logging.level.org.apache.http=DEBUG
logging.level.org.apache.http.wire=DEBUG

